# You must use a tab-size of 4 spaces to edit this file.
---
zenario_email_template:
    tabs:
        email_body:
            fields:
                user_form_merge_fields:
                    grouping_wrapper_css_class: zfab_merge_fields_wrap
                    grouping_css_class: zfab_merge_fields
                    type: grouping
                    ord: body - 0.1
                user_form:
                    grouping: user_form_merge_fields
                    type: select
                    css_class: email_merge_fields iconselectmenu
                    empty_value: "Insert merge fields from form..."
                    format_onchange: true
                    tooltip: |
                        If this email is triggered by someone filling in a form, fields from the form can be merged into the email.
                user_form_field:
                    grouping: user_form_merge_fields
                    same_row: true
                    type: select
                    css_class: email_merge_fields iconselectmenu
                    empty_value: ...
                    format_onchange: true
                    hidden: true
