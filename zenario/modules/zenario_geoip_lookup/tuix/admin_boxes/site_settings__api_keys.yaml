# You must use a tab-size of 4 spaces to edit this file.
---
site_settings:
    setting_group: api_keys
    tabs:
        geoip:
            label: GeoIP2
            edit_mode:
                enabled: Yes
                priv: _PRIV_EDIT_SITE_SETTING
                on: No
            fields:
                description:
                    full_width: Yes
                    snippet:
                        html: Use this tab to enter a MaxMind license key for their GeoLite2 lookup service.
                maxmind_geoip2_license_key:
                    site_setting:
                        name: maxmind_geoip2_license_key
                    label: 'License Key:'
                    type: text
                    notices_below:
                        info_notice:
                            type: information
                            html: true
                            message: |
                                Please refer to the <a href="organizer.php#zenario__library/panels/modules_running_and_suspended/collection_buttons/view_all_modules////~-GeoIP Lookup" target="_blank">GeoIP Lookup</a> module's description for info on how to make things work.
