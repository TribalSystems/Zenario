{% if Show_Featured_Image %}
	<div class="sticky_image">
		{% if LINKS_IN_INCLUDES and item.Local_File_Id and not item.Disabled %}
			<a {{item.Link}}{{item.Target_Blank}}>
		{% endif %}
		
		{% if item.Featured_Image_HTML %}
			{{item.Featured_Image_HTML}}
		{% endif %}

		{% if LINKS_IN_INCLUDES and item.Local_File_Id and not item.Disabled %}
			</a>
		{% endif %}
	</div>
{% endif %}
