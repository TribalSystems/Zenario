# You must use a tab-size of 4 spaces to edit this file.
---
zenario_slide:
    lovs:
        title_merge_fields:
            user:
                label: 'Can be used when "userId" is in the URL'
            '[[userId]]':
                parent: user
                data-class: user_icon
                label: 'User ID: [[userId]]'
            '[[zenario_users:name]]':
                parent: user
                data-class: user_icon
                label: 'User first and last name: [[zenario_users:name]]'
            '[[zenario_users:salutation]]':
                parent: user
                data-class: user_icon
                label: 'User salutation: [[zenario_users:salutation]]'
            '[[zenario_users:firstName]]':
                parent: user
                data-class: user_icon
                label: 'User first name: [[zenario_users:firstName]]'
            '[[zenario_users:lastName]]':
                parent: user
                data-class: user_icon
                label: 'User last name: [[zenario_users:lastName]]'
            '[[zenario_users:screenName]]':
                parent: user
                data-class: user_icon
                label: 'User screen name: [[zenario_users:screenName]]'
