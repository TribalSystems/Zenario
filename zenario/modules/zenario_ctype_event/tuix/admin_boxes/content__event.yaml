# You must use a tab-size of 4 spaces to edit this file.
---
zenario_content:
    tabs:
        zenario_ctype_event__when_and_where:
            ord: 24
            label: 'When & Where'
            edit_mode:
                enabled: ""
            visible_if: "zenarioAB.tuix.key.cType == 'event'"
            fields:
                desc:
                    snippet:
                        html: Use this screen to set dates, times and a location.
                    full_width: true
                
                grouping_start_date_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                start_date_original:
                    grouping: grouping_start_date_left
                    label: 'Start date (original):'
                    type: date
                    show_as_a_span: true
                
                grouping_start_date_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                start_date:
                    grouping: grouping_start_date_right
                    label: 'Start date:'
                    type: date
                    format_onchange: true
                    last_value: ""
                    change_month_and_year: true
                    allow_typing_in_date_field: true
                    show_date_format_as_placeholder: true
                
                grouping_end_date_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                end_date_original:
                    grouping: grouping_end_date_left
                    label: 'End date (original):'
                    type: date
                    show_as_a_span: true
                
                grouping_end_date_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                end_date:
                    grouping: grouping_end_date_right
                    label: 'End date:'
                    type: date
                    side_note: Set this if it's a multi-day event, otherwise leave it the same as the start date.
                    change_month_and_year: true
                    allow_typing_in_date_field: true
                    show_date_format_as_placeholder: true
                
                grouping_specify_time_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                specify_time_original:
                    grouping: grouping_specify_time_left
                    label: 'Specify a time (original)'
                    type: checkbox
                    show_as_a_span: true
                
                grouping_specify_time_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                specify_time:
                    grouping: grouping_specify_time_right
                    label: 'Specify a time'
                    type: checkbox
                    side_note: Set this if you want to show the start and end time of the event, as well as the date.
                    format_onchange: true
                
                grouping_start_time_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                start_time_original:
                    grouping: grouping_start_time_left
                    indent: 1
                    label: 'Start time (original):'
                    type: text
                    show_as_a_span: true
                
                grouping_start_time_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                start_time_hours:
                    grouping: grouping_start_time_right
                    indent: 1
                    hidden: true
                    label: 'Start time:'
                    pre_field_html: '&nbsp;Hours:&nbsp;'
                    type: select
                    values: {}
                    last_value: ""
                    format_onchange: true
                start_time_minutes:
                    grouping: grouping_start_time_right
                    hidden: true
                    same_row: true
                    pre_field_html: '&nbsp;Minutes:&nbsp;'
                    type: select
                    values: {}
                    last_value: ""
                    format_onchange: true
                
                grouping_end_time_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                end_time_original:
                    grouping: grouping_end_time_left
                    indent: 1
                    label: 'End time (original):'
                    type: text
                    show_as_a_span: true
                
                late_evening_event_original:
                    grouping: grouping_end_time_left
                    indent: 1
                    label: '+1 day'
                    type: checkbox
                    same_row: true
                    show_as_a_span: true
                
                grouping_end_time_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                end_time_hours:
                    grouping: grouping_end_time_right
                    indent: 1
                    hidden: true
                    label: 'End time:'
                    pre_field_html: '&nbsp;Hours:&nbsp;'
                    type: select
                    values: {}
                end_time_minutes:
                    grouping: grouping_end_time_right
                    hidden: true
                    same_row: true
                    pre_field_html: '&nbsp;Minutes:&nbsp;'
                    type: select
                    values: {}
                late_evening_event:
                    grouping: grouping_end_time_right
                    indent: 1
                    label: '+1 day'
                    type: checkbox
                    side_note: Check this if your event runs past midnight and the end time is next day.
                    same_row: true
                
                grouping_event_timezone_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                event_timezone_original:
                    grouping: grouping_event_timezone_left
                    indent: 1
                    label: 'Event timezone (original):'
                    type: text
                    show_as_a_span: true
                
                grouping_event_timezone_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                event_timezone:
                    grouping: grouping_event_timezone_right
                    indent: 1
                    type: radios
                    label: 'Event timezone:'
                    value: default_timezone
                    values:
                        default_timezone:
                            ord: 1
                            label: Default timezone ([[default_timezone]])
                        other_timezone:
                            ord: 2
                            label: Other timezone...
                    visible_if: lib.value('specify_time')
                    redraw_onchange: true
                    notices_below:
                        enable_timezone_support:
                            hidden: true
                            type: information
                            message: ''
                            html: true
                event_other_timezone:
                    grouping: grouping_event_timezone_right
                    indent: 2
                    type: select
                    values: []
                    empty_value:  — Select event timezone — 
                    visible_if: lib.value('specify_time') && (lib.value('event_timezone') == 'other_timezone')
                    validation:
                        required_if_not_hidden: 'Please select a timezone.'
                
                grouping_event_location_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                locations_snippet_original:
                    grouping: grouping_event_location_left
                    snippet:
                        html: |
                            <span class="title">Where it's on (original):</span>
                online_original:
                    grouping: grouping_event_location_left
                    label: 'Online'
                    type: checkbox
                    show_as_a_span: true
                at_location_checkbox_original:
                    grouping: grouping_event_location_left
                    label: 'At a physical location'
                    type: checkbox
                    show_as_a_span: true
                at_physical_location_original:
                    grouping: grouping_event_location_left
                    indent: 1
                    type: select
                    values:
                        location_picker:
                            label: 'Location in database'
                        address_text:
                            label: 'Address not in database'
                    visible_if: lib.value('at_location_checkbox_original')
                    show_as_a_span: true
                location_id_original:
                    grouping: grouping_event_location_left
                    indent: 2
                    label: 'Location (original):'
                    pick_items:
                        path: zenario__locations/panel
                        target_path: zenario__locations/panel
                        min_path: zenario__locations/panel
                        nothing_selected_phrase: No location selected
                        select_phrase: Select a location...
                    visible_if: lib.value('at_location_checkbox_original') && lib.value('at_physical_location_original') == 'location_picker'
                    show_as_a_span: true
                location_original:
                    grouping: grouping_event_location_left
                    indent: 2
                    label: 'Enter the address (original):'
                    type: text
                    maxlength: 250
                    visible_if: lib.value('at_location_checkbox_original') && lib.value('at_physical_location_original') == 'address_text'
                
                grouping_event_location_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                locations_snippet:
                    grouping: grouping_event_location_right
                    snippet:
                        html: |
                            <span class="title">Where it's on:</span>
                online:
                    grouping: grouping_event_location_right
                    ord: 100
                    label: 'Online'
                    type: checkbox
                at_location_checkbox:
                    grouping: grouping_event_location_right
                    ord: 101
                    label: 'At a physical location'
                    type: checkbox
                    redraw_onchange: true
                at_physical_location:
                    grouping: grouping_event_location_right
                    ord: 102
                    indent: 1
                    type: select
                    redraw_onchange: true
                    values:
                        location_picker:
                            label: 'Location in database'
                        address_text:
                            label: 'Address not in database'
                    visible_if: lib.value('at_location_checkbox')
                    validation:
                        required_if_not_hidden: 'Please select one of the options.'
                    value: address_text
                    notices_below:
                        enable_address_text:
                            hidden: true
                            type: information
                            message: ''
                            html: true
                location_id:
                    grouping: grouping_event_location_right
                    ord: 103
                    indent: 2
                    label: 'Location:'
                    pick_items:
                        path: zenario__locations/panel
                        target_path: zenario__locations/panel
                        min_path: zenario__locations/panel
                        nothing_selected_phrase: No location selected
                        select_phrase: Select a location...
                    visible_if: lib.value('at_location_checkbox') && lib.value('at_physical_location') == 'location_picker'
                    validation:
                        required_if_not_hidden: 'Please select a location.'
                location:
                    grouping: grouping_event_location_right
                    ord: 104
                    indent: 2
                    label: 'Enter the address:'
                    type: text
                    maxlength: 250
                    visible_if: lib.value('at_location_checkbox') && lib.value('at_physical_location') == 'address_text'
                    validation:
                        required_if_not_hidden: 'Please enter an address.'
                
                #If the Conference Manager module is running, an event may be linked to a conference.
                #The relevant fields will be in this grouping.
                conference_grouping_left:
                    ord: 105
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                conference_grouping_right:
                    ord: 106
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                grouping_event_url_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                event_url_original:
                    grouping: grouping_event_url_left
                    label: 'URL for further info (original):'
                    type: text
                    show_as_a_span: true
                
                grouping_event_url_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                url:
                    grouping: grouping_event_url_right
                    ord: 106
                    label: 'URL for further info:'
                    type: text
                    side_note: >
                        To enter the URL of an external page, start the URL with http:// or https://
                    onclick: "if ($(this).val()=='') {$(this).val('http://')}"
                url_test:
                    grouping: grouping_event_url_right
                    ord: 107
                    same_row: true
                    type: button
                    css_class: zenario_gp_button
                    value: Test
                    onclick: "if ($(lib.get('url')).val()!='') {window.open($(lib.get('url')).val())}"