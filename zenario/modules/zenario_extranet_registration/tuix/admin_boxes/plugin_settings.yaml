# You must use a tab-size of 4 spaces to edit this file.
---
plugin_settings:
    module_class_name: zenario_extranet_registration
    tabs:
        first_tab:
            ord: 1
            label: Signup screen
            fields:
                desc:
                    ord: 0
                    full_width: true
                    snippet:
                        html: >
                          <p>This tab defines the initial signup form of the user/contact registration system.</p>
            
                name_fields:
                    snippet:
                        html: |
                            <div class="zenario_fbInfo">
                                The registration form will show email, name and password fields. A first name may not exceed 25 characters, and a last name may not exceed 35 characters.
                            </div>
                
                initial_email_address_status:
                    label: 'Email address verification:'
                    type: radios
                    plugin_setting:
                        name: initial_email_address_status
                    values:
                        not_verified:
                            label: Require verification (recommended)
                        verified:
                            label: Don't verify
                    value: not_verified
                    format_onchange: true
                    side_note: >
                        Send a verification email to the user with a special link; use this to be sure that the user/contact can access the email address they entered.
                verification_email_template:
                    label: 'Email template for verification:'
                    plugin_setting:
                        name: verification_email_template
                        foreign_key_to: email_template
                        dangling_cross_references: remove
                    pick_items:
                        path: zenario__email_template_manager/panels/email_templates
                        min_path: zenario__email_template_manager/panels/email_templates
                        max_path: zenario__email_template_manager/panels/email_templates
                        target_path: zenario__email_template_manager/panels/email_templates
                        select_phrase: Select email template...
                        hide_remove_button: true
                    validation:
                        required_if_not_hidden: Please select an email template
                    value: zenario_extranet_registration__to_user_email_verification_en
                    note_below: 'By default this plugin uses the email template with code "zenario_extranet_registration__to_user_email_verification_en".'
                    side_note: >
                        Please see the module description to get a full list of merge fields which can be used in the selected email template.
                    indent: 1
            
                show_resend_verification_link:
                    label: |
                      Show link to "Resend verification email"
                    plugin_setting:
                        name: show_resend_verification_link
                    type: checkbox
                    indent: 1
                    value: "1"
                
                user_password:
                    label: "User's password:"
                    type: select
                    plugin_setting:
                        name: user_password
                    values:
                        user_to_choose_password:
                            label: "User to choose password"
                        user_to_have_random_password:
                            label: "Auto-create a password for the user"
                    value: user_to_choose_password
                    format_onchange: true
                    empty_value: "-- Select --"
                    validation:
                        required_if_not_hidden: "Please select an option for the user's password."
                password_needs_changing:
                    visible_if: "zenarioAB.value('user_password') == 'user_to_have_random_password'"
                    label: 'User must change password on next login'
                    plugin_setting:
                        name: password_needs_changing
                    type: checkbox
                    indent: 1
                    value: "0"
                    side_note: >
                        When the extranet user next logs in to the site, they will be asked to change their password before they can access the extranet area.
                
                user_email_verification:
                    label: 'Require email address to be entered twice'
                    plugin_setting:
                        name: user_email_verification
                    type: checkbox
                    value: "0"
                    side_note: >
                        Users must enter their email twice before they can continue.
                
                show_salutation:
                    label: 'Show salutation field'
                    plugin_setting:
                        name: show_salutation
                    type: checkbox
                    value: "0"
                    side_note: |
                        Show field for salutations, with a helper dropdown from the centralised list. See the <a href='organizer.php#zenario__languages/panels/salutations' target='_blank'>Salutations</a> panel.
                
                show_screen_name:
                    label: 'Show screen name'
                    plugin_setting:
                        name: show_screen_name
                    type: checkbox
                    readonly: true
                    side_note: >
                        To show/hide screen name you must change the "Use screen names" <a href='organizer.php#zenario__administration/panels/site_settings//users~.site_settings~tnames~k{"id"%3A"users"}' target='_blank'>site setting</a>.
            
                requires_terms_and_conditions:
                    plugin_setting:
                        name: requires_terms_and_conditions
                    label: 'Show a mandatory checkbox to give consent (e.g. for personal data storage)'
                    type: checkbox
                    value: ""
                    format_onchange: true
                    side_note: >
                        Show a terms and conditions checkbox which must be checked in order to register. Every registration will be recorded in the <a href='organizer.php#zenario__users/panels/consents' target='_blank'>consents log</a>.
                link_type:
                    plugin_setting:
                        name: link_type
                    label: 'Destination:'
                    type: select
                    value: _CONTENT_ITEM
                    visible_if: "zenarioAB.value('requires_terms_and_conditions') == true"
                    values:
                        _CONTENT_ITEM:
                            label: Link to a content item
                        _EXTERNAL_URL:
                            label: Link to an external URL
                    format_onchange: true
                    indent: 1
                    
                terms_and_conditions_page:
                    indent: 2
                    plugin_setting:
                        name: terms_and_conditions_page
                        foreign_key_to: content
                    label: 'Terms and conditions page:'
                    pick_items:
                        path: zenario__content/panels/content/refiners/filter_by_lang////
                        min_path: zenario__content/panels/content
                        max_path: zenario__content/panels/content
                        target_path: zenario__content/panels/content
                        disallow_refiners_looping_on_min_path: true
                        select_phrase: Select a content item...
                        hide_remove_button: true
                    visible_if: "zenarioAB.value('link_type') != '_EXTERNAL_URL'"
                    validation:
                        required_if_not_hidden: Please select a terms and conditions page
                    side_note: >
                        A link to this page will be placed in the "Accept our terms and conditions" checkbox text. Always opens in a new window.       
                url:
                    indent: 2
                    plugin_setting:
                        name: url
                        foreign_key_to: content
                    label: 'External URL:'
                    type: url
                    maxlength: "255"
                    value: ""
                    visible_if: "zenarioAB.value('link_type') == '_EXTERNAL_URL'"
                    validation:
                        required_if_not_hidden: "Please enter a URL."
                    note_below: "Always opens in a new window."  
                use_captcha:
                    plugin_setting:
                        name: use_captcha
                    label: 'Show a captcha'
                    type: checkbox
                    side_note: >
                        Require completion of a captcha to ensure a human is using the registration form.
            
                show_link_to_login_page:
                    plugin_setting:
                        name: show_link_to_login_page
                    label: Show "Go to login" link
                    type: checkbox
                    value: 1
                    redraw_onchange: true
                login_page:
                    visible_if: zenarioAB.value('show_link_to_login_page')
                    plugin_setting:
                        name: login_page
                        foreign_key_to: content
                    label: 'Login page:'
                    pick_items:
                        path: zenario__content/panels/content/refiners/filter_by_lang////
                        min_path: zenario__content/panels/content
                        max_path: zenario__content/panels/content
                        target_path: zenario__content/panels/content
                        disallow_refiners_looping_on_min_path: true
                        select_phrase: Select a content item...
                        hide_remove_button: true
                    validation:
                        required_if_not_hidden: Please select a login page.
                    indent: 1
                
                custom_fields_desc:
                    snippet:
                        html: |
                            <div class="zenario_fbInfo">
                                You may add <a href='organizer.php#zenario__administration/panels/custom_datasets/item_buttons/edit_gui//[[id]]//' target='_blank'>user dataset fields</a> to the registration form.<br />
                                If using the standard framework, all custom fields will appear after last name and will be optional.<br />
                                System fields may not be selected.<br />
                                Custom fields may be selected except these types:
                                <ul>
                                    <li>Checkbox group</li>
                                    <li>Editor</li>
                                    <li>Dataset picker</li>
                                    <li>File picker</li>
                                </ul>
                user_custom_fields:
                    plugin_setting:
                        name: user_custom_fields
                    format_onchange: true
                    label: 'Custom fields:'
                    pick_items:
                        reorder_items: true
                        multiple_select: true
                        enable_type_ahead_search: true
                        #The path is built in the PHP class.
                        path: ''
                        select_phrase: Select custom field...
                        disabled_if_for_any_selected_items: (!item.is_field || item.is_system_field || (['checkboxes', 'editor', 'other_system_field', 'dataset_picker', 'file_picker'].includes(item.type)))
                        disallow_refiners_looping_on_min_path: true
        
        initial_signup_actions:
            label: Actions 1
            fields:
                desc:
                    full_width: true
                    snippet:
                        html: |
                          <p>This tab defines initial signup actions, i.e. actions that are performed when the account is first created.</p>
                initial_account_status:
                    label: 'Status after initial signup:'
                    type: radios
                    plugin_setting:
                        name: initial_account_status
                    values:
                        contact:
                            label: Contact
                        pending:
                            label: User with pending status
                    format_onchange: true
                    value: pending
                    side_note: >
                        After initial sign-up, set the account to be either "Contact" (the site can send them email, but they cannot log in) or "User" (they may be able to log in).
                
                enable_notifications_on_user_signup:
                    label: 'Notify an administrator when a user/contact signs up'
                    type: checkbox
                    plugin_setting:
                        name: enable_notifications_on_user_signup
                    format_onchange: true
                    value: ""
                user_signup_notification_email_address:
                    label: 'Email address for notifications:'
                    type: text
                    plugin_setting:
                        name: user_signup_notification_email_address
                        is_email_address: true
                    side_note: >
                        Notify these administrators of new sign-ups. Separate multiple email addresses with commas.
                    indent: 1
                user_signup_notification_email_template:
                    label: 'Email template for notifications:'
                    plugin_setting:
                        name: user_signup_notification_email_template
                        foreign_key_to: email_template
                        dangling_cross_references: remove
                    pick_items:
                        path: zenario__email_template_manager/panels/email_templates
                        min_path: zenario__email_template_manager/panels/email_templates
                        max_path: zenario__email_template_manager/panels/email_templates
                        target_path: zenario__email_template_manager/panels/email_templates
                        select_phrase: Select email template...
                        hide_remove_button: true
                    validation:
                        required_if_not_hidden: Please select an email template
                    value: zenario_extranet_registration__to_admin_user_signup_notification_en
                    note_below: 'By default this plugin uses the email template with code "zenario_extranet_registration__to_admin_user_signup_notification_en".'
                    indent: 1
                
                set_characteristics_on_new_users:
                    plugin_setting:
                        name: set_characteristics_on_new_users
                    label: When user/contact registers, set a checkbox on account
                    type: checkbox
                    format_onchange: true
                    side_note: >
                        When account for user or contact is created, set a checkbox on the account. See the [[link_start]]Users dataset[[link_end]].

                select_characteristics_for_new_users:
                    plugin_setting:
                        name: select_characteristics_for_new_users
                    label: 'Dataset flag:'
                    type: select
                    empty_value: ' -- Select -- '
                    validation:
                        required_if_not_hidden: Please select a dataset flag.
                    format_onchange: true
                    indent: 1
            
                select_characteristic_values_for_new_users:
                    plugin_setting:
                        name: select_characteristic_values_for_new_users
                    label: 'Dataset flag values:'
                    type: checkboxes
                    validation:
                        required_if_not_hidden: Please select a value for the Users dataset flag.
                    indent: 1
                
                set_timer_on_new_users:
                    plugin_setting:
                        name: set_timer_on_new_users
                    label: |
                      When user registers, start a user timer
                    type: checkbox
                    format_onchange: true
                    side_note: >
                        When a user account is created, start a timer for that user. See [[link_start]]Timer plans[[link_end]].
                
                timer_for_new_users:
                    plugin_setting:
                        name: timer_for_new_users
                    label: 'User timer:'
                    pick_items:
                        path: zenario__users/panels/timer_templates/refiners/allow_new_users//users//
                        min_path: zenario__users/panels/timer_templates
                        max_path: zenario__users/panels/timer_templates
                        target_path: zenario__users/panels/timer_templates
                        select_phrase: Select user timer...
                        hide_remove_button: true
                    validation:
                        required_if_not_hidden: Please select a user timer.
                    indent: 1
                
                add_user_to_group:
                    plugin_setting:
                        name: add_user_to_group
                    label: |
                      When user/contact registers, add them to a group
                    type: checkbox
                    format_onchange: true
                    side_note: >
                        When a user or contact account is created, add it to a group. See [[link_start]]Groups[[link_end]].
                select_group_for_new_users:
                    plugin_setting:
                        name: select_group_for_new_users
                    label: |
                      Group:
                    type: select
                    empty_value: ' -- Select -- '
                    validation:
                        required_if_not_hidden: Please select a group.
                    indent: 1

        user_activation:
            label: Actions 2
            fields:
                desc:
                    full_width: true
                    snippet:
                        html: |
                          <p>This tab defines actions to perform on the user/contact account after the individual has verified their email address.</p>
                verified_account_status:
                    label: 'Status after email verification:'
                    type: radios
                    plugin_setting:
                        name: verified_account_status
                    values:
                        leave:
                            label: Leave account as-is
                        contact:
                            label: Set to Contact
                        active:
                            label: Set to User with active status
                        check_trusted:
                            label: Set to User with active status if from a trusted domain, otherwise leave as-is
                    format_onchange: true
                    value: active
                    side_note: >
                        When the user verifies their email address, set status to User (active status) to allow login; otherwise leave as Contact/User (pending status).
                trusted_email_domains:
                    plugin_setting:
                        name: trusted_email_domains
                    label: 'List of trusted email domains:'
                    type: text
                    side_note: >
                        Enter a comma separated list of email domains, e.g. @zenar.io. Users who have an email address 
                        in one of these domains will made active after email verification.
                    indent: 1
                
                welcome_email_template:
                    label: '"Welcome" email:'
                    plugin_setting:
                        name: welcome_email_template
                        foreign_key_to: email_template
                        dangling_cross_references: remove
                    pick_items:
                        path: zenario__email_template_manager/panels/email_templates
                        min_path: zenario__email_template_manager/panels/email_templates
                        max_path: zenario__email_template_manager/panels/email_templates
                        target_path: zenario__email_template_manager/panels/email_templates
                        select_phrase: Select an email template...
                    side_note: "The email template to use for welcome emails to newly activated users. Only applies when initial status is active. See the module description for a list of merge fields."
                    value: zenario_users__to_user_account_activated
                    note_below: 'By default this plugin uses the email template with code "zenario_users__to_user_account_activated".'
                    indent: 1
                    format_onchange: true
                
                include_an_attachment:
                    plugin_setting:
                        name: include_an_attachment
                    label: Include an attachment
                    type: checkbox
                    value: 0
                    format_onchange: true
                    indent: 2
                selected_attachment:
                    plugin_setting:
                        name: selected_attachment
                        foreign_key_to: file
                    pick_items:
                        path: zenario__library/panels/documents
                        min_path: zenario__library/panels/documents
                        max_path: zenario__library/panels/documents
                        target_path: zenario__library/panels/documents
                        select_phrase: Select an attachment...
                        hide_remove_button: true
                    validation:
                        required_if_not_hidden: Please select an attachment.
                    indent: 3
                    format_onchange: true
                
                show_welcome_page:
                    plugin_setting:
                        name: show_welcome_page
                    label: 'Redirect to first visit welcome page:'
                    type: radios
                    value: _NEVER
                    values:
                        _ALWAYS:
                            ord: 1
                            label: Always redirect to a first visit welcome page
                        _IF_NO_PREVIOUS_PAGE:
                            ord: 2
                            label: >
                                As second priority; if another private content item was
                                requested, redirect to that item
                        _NEVER:
                            ord: 3
                            label: >
                                Never (redirect to requested private content item, or else to the
                                previous page viewed)
                    format_onchange: true
                welcome_page:
                    plugin_setting:
                        name: welcome_page
                        foreign_key_to: content
                    label: 'First visit welcome page:'
                    pick_items:
                        path: zenario__content/panels/content/refiners/filter_by_lang////
                        min_path: zenario__content/panels/content
                        max_path: zenario__content/panels/content
                        target_path: zenario__content/panels/content
                        disallow_refiners_looping_on_min_path: true
                        select_phrase: Select a content item...
                        hide_remove_button: true
                    validation:
                        required_if_not_hidden: Please select a content item
                    indent: 1

                user_activation_notification_email_enable:
                    label: Notify an administrator by email when a user is activated
                    type: checkbox
                    plugin_setting:
                        name: user_activation_notification_email_enable
                    format_onchange: true
                    side_note: >
                        Be notified by email when an account is activated or awaits manual activation.
                    value: ""
                user_activation_notification_email_template:
                    label: 'Email template:'
                    plugin_setting:
                        name: user_activation_notification_email_template
                        foreign_key_to: email_template
                        dangling_cross_references: remove
                    pick_items:
                        path: zenario__email_template_manager/panels/email_templates
                        min_path: zenario__email_template_manager/panels/email_templates
                        max_path: zenario__email_template_manager/panels/email_templates
                        target_path: zenario__email_template_manager/panels/email_templates
                        select_phrase: Select email template...
                        hide_remove_button: true
                    validation:
                        required_if_not_hidden: Please select an email template
                    side_note: >
                        Please see the module description to get a full list of merge fields.
                    value: zenario_extranet_registration__to_admin_user_activation_notification_en
                    note_below: 'By default this plugin uses the email template with code "zenario_extranet_registration__to_admin_user_activation_notification_en".'
                    indent: 1
                user_activation_notification_email_address:
                    label: "Send to:"
                    type: text
                    plugin_setting:
                        name: user_activation_notification_email_address
                    side_note: >
                        Enter the recipient(s) who should be notified. Multiple email addresses can be separated by commas.
                    indent: 1
                
                show_message_when_user_is_first_activated:
                    plugin_setting:
                        name: show_message_when_user_is_first_activated
                    label: Show a message when user account is first activated
                    type: checkbox
                    value: 1
                    redraw_onchange: true
                user_is_first_activated_message:
                    indent: 1
                    plugin_setting:
                        name: user_is_first_activated_message
                    label: 'Message:'
                    type: text
                    value: Congratulations, your account has been activated.
                    show_phrase_icon: true
                    visible_if: lib.value('show_message_when_user_is_first_activated')
                    validation:
                        required_if_not_hidden: 'Please enter the message.'
                
                show_message_if_user_views_register_page_subsequently:
                    plugin_setting:
                        name: show_message_if_user_views_register_page_subsequently
                    label: Show a message if user views the Register page subsequently
                    type: checkbox
                    value: 1
                    redraw_onchange: true
                user_views_register_page_subsequently_message:
                    indent: 1
                    plugin_setting:
                        name: user_views_register_page_subsequently_message
                    label: 'Message:'
                    type: text
                    value: It looks like you have already registered for an account.
                    show_phrase_icon: true
                    visible_if: lib.value('show_message_if_user_views_register_page_subsequently')
                    validation:
                        required_if_not_hidden: 'Please enter the message.'
                
                show_link_to_profile_page:
                    plugin_setting:
                        name: show_link_to_profile_page
                    label: |
                        Show link to "profile" special page
                    type: checkbox
                    value: 1
                    redraw_onchange: true
                profile_page:
                    plugin_setting:
                        foreign_key_to: content
                    label: 'Profile page:'
                    pick_items:
                        path: zenario__content/panels/content/refiners/filter_by_lang////
                        min_path: zenario__content/panels/content
                        max_path: zenario__content/panels/content
                        target_path: zenario__content/panels/content
                        disallow_refiners_looping_on_min_path: true
                        select_phrase: Select a content item...
                        hide_remove_button: true
                    readonly: true
                    indent: 1
                    visible_if: lib.value('show_link_to_profile_page')
                
                show_link_to_change_password_page:
                    plugin_setting:
                        name: show_link_to_change_password_page
                    label: |
                        Show link to "change password" special page
                    type: checkbox
                    value: 1
                    redraw_onchange: true
                change_password_page:
                    plugin_setting:
                        foreign_key_to: content
                    label: 'Change password page:'
                    pick_items:
                        path: zenario__content/panels/content/refiners/filter_by_lang////
                        min_path: zenario__content/panels/content
                        max_path: zenario__content/panels/content
                        target_path: zenario__content/panels/content
                        disallow_refiners_looping_on_min_path: true
                        select_phrase: Select a content item...
                        hide_remove_button: true
                    readonly: true
                    indent: 1
                    visible_if: lib.value('show_link_to_change_password_page')
                
                show_link_to_logout_page:
                    plugin_setting:
                        name: show_link_to_logout_page
                    label: |
                        Show link to "logout" special page
                    type: checkbox
                    value: 1
                    redraw_onchange: true
                logout_page:
                    plugin_setting:
                        foreign_key_to: content
                    label: 'Logout page:'
                    pick_items:
                        path: zenario__content/panels/content/refiners/filter_by_lang////
                        min_path: zenario__content/panels/content
                        max_path: zenario__content/panels/content
                        target_path: zenario__content/panels/content
                        disallow_refiners_looping_on_min_path: true
                        select_phrase: Select a content item...
                        hide_remove_button: true
                    readonly: true
                    indent: 1
                    visible_if: lib.value('show_link_to_logout_page')
        text:
            label: Text
            fields:
                description:
                    snippet:
                        html: >
                            <p>This tab determines what text to display on the signup screen and after email verification.</p>
                registration_title:
                    label: 'Title:'
                    type: text
                    plugin_setting:
                        name: registration_title
                    value: 'Create an account'
                    show_phrase_icon: true
                register_button_text:
                    label: 'Register button text:'
                    type: text
                    plugin_setting:
                        name: register_button_text
                    value: 'Register'
                    show_phrase_icon: true
                resend_verification_email_link_text:
                    label: 'Resend verification email link text:'
                    type: text
                    plugin_setting:
                        name: resend_verification_email_link_text
                    value: 'Resend verification email'
                    show_phrase_icon: true
                resend_verification_email_link_description:
                    label: 'Resend verification email link description:'
                    type: text
                    plugin_setting:
                        name: resend_verification_email_link_description
                    value: 'Use this if you have previously registered but not received your verification email.'
                    show_phrase_icon: true
                go_back_to_login_text:
                    label: |
                      "Go to login" text:
                    type: text
                    plugin_setting:
                        name: go_back_to_login_text
                    value: 'Go back to Login'
                    show_phrase_icon: true
                register_thank_you_verify_email_text:
                    label: 'Register thank you text - verify email:'
                    type: textarea
                    plugin_setting:
                        name: register_thank_you_verify_email_text
                    value: | 
                            Thank you for registering.
                        
                            You have been sent an email with a verification link. You should check your spam/bulk mail if you do not see it soon. Please click the link in the email to verify your account.
                    show_phrase_icon: true
                register_thank_you_wait_for_activation_text:
                    label: 'Register thank you text - wait for activation:'
                    type: textarea
                    plugin_setting:
                        name: register_thank_you_wait_for_activation_text
                    value: | 
                            Thank you for registering.
                        
                            Your account will need to be manually activated by one of our Administrators before you may log in.
                    show_phrase_icon: true
                register_thank_you_verify_email_resent_text:
                    label: 'Register thank you text - verify email resent:'
                    type: textarea
                    plugin_setting:
                        name: register_thank_you_verify_email_resent_text
                    value: | 
                            Your verification email has been resent. Please be sure to check your spam/bulk mail folder.
                    show_phrase_icon: true
    
        error_messages:
            label: Error phrases
            fields:
                description:
                    full_width: true
                    snippet:
                        html: >
                            <p>This tab determines what error messages to display if certain things fail.</p>
                email_not_in_db_message:
                    plugin_setting:
                        name: email_not_in_db_message
                    label: 'If email address is not in the database:'
                    type: text
                    value: "This email address is not associated with any account."
                    show_phrase_icon: true
                already_verified_message:
                    plugin_setting:
                        name: already_verified_message
                    label: 'If email address is ready verified and resend verification email is requested:'
                    type: text
                    value: "This email address has already been verified."
                    show_phrase_icon: true
                contact_not_extranet_message:
