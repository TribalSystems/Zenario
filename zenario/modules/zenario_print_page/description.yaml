display_name: Print a page
description: |
            <p>This module provides a link that visitors can use to print the current page.</p>
            <p>It should ususally be added to a layout or a site-wide footer, although can also be added to an individual content item.</p>
category: pluggable

# Reminder: you need to increment the LATEST_REVISION_NO in this module's
# latest_revision_no.inc.php file if you change any of the fields below:
vlp_class_name: zenario_print_page
css_class_name: zenario_print_page
is_pluggable: true
can_be_version_controlled: false
default_framework: standard
default_instance_name: Print page
can_be_plugged_into:
    content_items: true
    layouts: true
    regular_nests: false
    slideshows: false
    ajax_nests_without_conductor: false
    ajax_nests_with_conductor: false
