                                Content items may get different scores depending on their release date or published date.<br />
                                Their scores may be multiplied by a number between 0 and 12 (one decimal is allowed).<br />
                                If release dates are enabled for a content type, the plugin will use them first for each content item that has one set and fall back on the published date.<br />
