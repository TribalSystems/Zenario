# You must use a tab-size of 4 spaces to edit this file.
---
zenario_convert_nest:
    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
    key:
        id: null
        cID: null
        cType: null
        cVersion: null
        slotName: null
        instanceId: null
        frontEnd: null
    hide_tab_bar: true
    css_class: zenario_fab_plugin
    identifier:
        css_class: plugin_album_instance
        label: Nest
        value: ''
    tabs:
        details:
            edit_mode:
                enabled: true
            fields:
                desc:
                    snippet:
                        p: |
                           Use this to convert a nest between the Nest module and the Ajax Nest module.
                module_class_name:
                    label: 'Module:'
                    type: select
                    value: cycle2
                    values:
                        zenario_nest:
                            label: 'Nest'
                        zenario_ajax_nest:
                            label: 'Ajax Nest'
                    format_onchange: true
                
                zenario_nest_desc:
                    indent: 1
                    hide_if_previous_outdented_value_isnt: zenario_nest
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        html: |
                            Used for a nest with multiple slides. SEO friendly when used on public pages (slides are preloaded on the client browser, and transistions are
                            implemented using JavaScript, so their content can be read by search engine bots).
                zenario_ajax_nest_desc:
                    indent: 1
                    hide_if_previous_outdented_value_isnt: zenario_ajax_nest
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        html: |
                            Used for a nest with one or multiple slides. Only one slide is loaded on the client browser at a time, and transistions
                            between slides are implemented using AJAX (server-side calls). Allows use of Conductor for advanced nest configurations.
                
                animation_library:
                    indent: 1
                    hide_if_previous_outdented_value_isnt: zenario_nest
                    label:  'Appearance:'
                    type: select
                    empty_value: ' -- Select -- '
                    values:
                        cycle2:
                            label: 'Show as slides'
                        accordion:
                            label: 'Show as an accordion'
                    redraw_onchange: true
                    validation:
                        required_if_not_hidden: 'Please select an appearance.'
                
                cycle2_desc:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: cycle2
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        html: |
                            One slide will be shown at a time.
                accordion_desc:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: accordion
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        html: |
                            Slides will open up using an accordion interface.
                
                nest_type:
                    indent: 2
                    visible_if: |
                        zenarioAB.value('module_class_name') == 'zenario_ajax_nest' ||
                        (zenarioAB.value('module_class_name') == 'zenario_nest' && zenarioAB.value('animation_library') == 'cycle2')
                    label: 'Navigation between slides:'
                    type: radios
                    format_onchange: true
                    values:
                        tabs:
                            label: Show slides' tabs and editable labels
                        tabs_and_buttons:
                            label: Show slides' tabs with editable labels, and "Next" and "Previous" buttons
                        buttons:
                            label: Show "Next" and "Previous" buttons
                        indicator_and_buttons:
                            visible_if: |
                                zenarioAB.value('module_class_name') == 'zenario_nest'
                            label: Show "Next" and "Previous buttons", with sequence indicator
                        indicator:
                            visible_if: |
                                zenarioAB.value('module_class_name') == 'zenario_nest'
                            label: Show sequence indicator only (use only with auto-advance slides)
                        permission:
                            visible_if: |
                                zenarioAB.value('module_class_name') == 'zenario_ajax_nest'
                            label: Single slide with no controls, or has user permissions applied to slides
                        conductor:
                            visible_if: |
                                zenarioAB.value('module_class_name') == 'zenario_ajax_nest'
                            label: Conductor-driven (advanced)
                    validation:
                        required_if_not_hidden: 'Please choose the method of navigation.'
                
                buttons_desc:
                    indent: 3
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt:
                        buttons: true
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        label: |
                            Next and Previous buttons will be shown, which can be used to navigate between slides.
                indicator_desc:
                    indent: 3
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt:
                        indicator: true
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        label: |
                            Every slide in the slideshow will have an indicator.
                            Clicking on the indicator will switch to that slide.
                indicator_and_buttons_desc:
                    indent: 3
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt:
                        indicator_and_buttons: true
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        label: |
                            Every slide in the slideshow will have an indicator.
                            Clicking on the indicator will switch to that slide.
                            Next and Previous buttons will also be shown, which can be used to navigate between slides.
                tabs_desc:
                    indent: 3
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt:
                        tabs: true
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        label: |
                            Every slide in the slideshow will have a tab with a label.
                            Clicking on a tab will switch to that slide.
                tabs_and_buttons_desc:
                    indent: 3
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt:
                        tabs_and_buttons: true
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        label: |
                            Every slide in the slideshow will have a tab with a label.
                            Clicking on a tab will switch to that slide.
                            Next and Previous buttons will also be shown, which can be used to navigate between slides.
                permission_desc:
                    indent: 3
                    hide_if_previous_outdented_value_isnt: permission
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        label: |
                            Only one slide, the first slide, will be shown.
                            
                            If you define multiple slides, visitors will be shown the first slide in the
                            list that they have permissions to see.
                            
                            You can use this to show different plugins to different people, based on
                            their permissions.
                conductor_desc:
                    indent: 3
                    hide_if_previous_outdented_value_isnt: conductor
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        label: |
                            When the visitor first visits the page, the first slide will be shown.
                            
                            From there on, conductor will be used to control the navigation.


