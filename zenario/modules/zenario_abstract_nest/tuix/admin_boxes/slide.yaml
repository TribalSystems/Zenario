# You must use a tab-size of 4 spaces to edit this file.
---
zenario_slide:
    key:
        id: ''
        slideId: ''
        slideNum: ''
        instanceId: ''
        idInOrganizer: ''
        usesConductor: false
        breadcrumbsOverridden: false
        cID: ""
        cType: ""
        cVersion: ""
        slotName: ""
    title: Slide
    hide_tab_bar: true
    identifier:
        css_class: zenario_nest_tab
        label: 'Slide number:'
        value: ''
    tabs:
        details:
            label: Details
            edit_mode:
                enabled: true
            notices:
                no_path_back_set:
                    type: warning
                    size: small
                    message: >
                        When a state has a path to another state, there must always be a "back" path going back the other way (or to another state). This path's target state doesn't have a "back" path. Don't forget to add a "back" path leading from it, or else the forward buttons won't appear.
            fields:
                slide_label:
                    row_class: zenario_row_with_dropdown
                    label: 'Slide label:'
                    type: text
                    maxlength: 150
                    validation:
                        required: Please enter a label for the link to this slide
                title_merge_fields:
                    same_row: true
                    visible_if: |
                        tuix.key.usesConductor &&
                        !tuix.key.breadcrumbsOverridden &&
                        !_.isEmpty(field.values)
                    type: select
                    css_class: slide_title_merge_fields iconselectmenu
                    empty_value: 'Add merge field...'
                    values: title_merge_fields
                    style: |
                        width: 400px;
                    onchange: |
                        var domTitle = lib.get('slide_label');
                        lib.insertText(domTitle, $(this).val())
                        $(this).val('').iconselectmenu('refresh');
                        $(domTitle).change();
                
                slide_label_notices:
                    notices_below:
                        appearance: {}
                
                set_page_title_with_conductor:
                    visible_if: tuix.key.usesConductor
                    label: 'Set the page title:'
                    type: select
                    value: append
                    values:
                        dont_set:
                            label: "Don't set"
                        append:
                            label: Append slide label to page title
                        overwrite:
                            label: Overwrite page title with slide label
                
                show_refresh:
                    visible_if: tuix.key.usesConductor
                    label: |
                      Show a "Refresh" button
                    type: checkbox
                    redraw_onchange: true
                
                show_auto_refresh:
                    hide_with_previous_field: true
                    label: |
                      Show an "Auto Refresh" toggle
                    type: checkbox
                    redraw_onchange: true
                auto_refresh_interval:
                    hide_with_previous_field: true
                    visible_if: >
                        zenarioAB.value('show_auto_refresh')
                    label: 'Refresh interval (seconds):'
                    type: text
                    value: 60
                    indent: 1
                    style: 'width:5em;'
                    validation:
                        numeric: The refresh interval must be numeric.
                
                
                slide_type:
                    visible_if: tuix.key.usesConductor
                    label: 'Slide type:'
                    type: select
                    format_onchange: true
                    value: key_slide
                    values:
                        key_slide:
                            label: Key slide
                        inner_slide:
                            label: Inner slide
                
                key_slide_desc:
                    indent: 1
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: key_slide
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        html: |
                            Key slides are starting points in the navigation.
                            They can have tab links going to them.
                            Each key slide has a command that will take the user to this slide from any other point in the conductor.
                global_command:
                    indent: 1
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: key_slide
                    label: 'Command name:'
                    type: text
                    maxlength: 100
                    note_below: |
                        Enter the name of a command that will take the user to this slide from other slides in the nest.
                    validation:
                        required_if_not_hidden: |
                            Please enter a command name, for example the name of the slide.
                        no_spaces: |
                            Please don't enter any spaces in the command's name.
                        screen_name: |
                            Please don't enter any special characters in the command's name.
                
                inner_slide_desc:
                    indent: 1
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: inner_slide
                    row_class: zenario_fbInfo zenario_fbInfo_small
                    snippet:
                        html: |
                            Inner slides are slides that cannot be accessed without first navigating from a different slide.
                            They must have at least one path going into them, and must have a back path going from them.
                
                show_back:
                    indent: 1
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: inner_slide
                    label: |
                        Show a "Back" button
                    note_below: |
                        Appears at the top of the slide.
                    type: checkbox
                    value: 1
                    redraw_onchange: true
                
                slide_link_image_id:
                    label: 'Image for tab link:'
                    pick_items:
                        path: zenario__library/panels/image_library
                        min_path: zenario__library/panels/image_library
                        max_path: zenario__library/panels/image_library
                        target_path: zenario__library/panels/image_library
                        select_phrase: Select image...
                    upload:
                        multi: false
                        accept: 'image/png, image/jpeg, image/gif, image/webp'
                        extensions:
                            - .gif
                            - .jpg
                            - .jpeg
                            - .png
                            - .webp
                        drag_and_drop: true
                        reorder_items: false
                
                apply_slide_specific_permissions:
                    label: |
                        Set specific slide permissions (advanced)
                    note_below: |
                        Use this to determine which kinds of user or visitor can see this slide.
                        If using a conductor-driven nest, you should use User Permissions
                        (in Organizer->Site Settings, User Permissions interface) and leave this unchecked.
                    type: checkbox
                    redraw_onchange: true
                
                privacy:
                    indent: 1
                    visible_if:
                        lib.value: apply_slide_specific_permissions
                    label: |
                        Visibility:
                    type: radios
                    value: public
                    values:
                        logged_in:
                            label: |
                                Private: only show to extranet users ([[user_count]])
                        group_members:
                            label: |
                                Private: only show to users in group...
                            split_values_if_selected: true
                        in_smart_group:
                            label: |
                                Private: only show to users in smart group...
                            split_values_if_selected: true
                        logged_in_not_in_smart_group:
                            label: |
                                Private: only show to users NOT in smart group...
                            split_values_if_selected: true
                        with_role:
                            label: |
                                Private: only show to users with role...
                            type: checkboxes
                            values: ""
                            checking_child_checks_parents: true
                            split_values_if_selected: true
                        logged_out:
                            label: Only show to visitors who are NOT logged in
                        call_static_method:
                            label: "Call a module's static method to decide (advanced):"
                        hidden:
                            label: Always hidden
                    format_onchange: true
                    validation:
                        required_if_not_hidden: Please select a visibility option
                group_ids:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    visible_if: >
                        zenarioAB.value('privacy') == 'group_members'
                    type: checkboxes
                    no_values_message: No groups found
                    validation:
                        required_if_not_hidden: Please select a group
                smart_group_id:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    visible_if: >
                        zenario.IN(zenarioAB.value('privacy'), 'in_smart_group', 'logged_in_not_in_smart_group')
                    type: select
                    empty_value: ' -- Select -- '
                    validation:
                        required_if_not_hidden: Please select a smart group
                role_ids:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    visible_if: >
                        zenarioAB.value('privacy') == 'with_role'
                    type: checkboxes
                    no_values_message: No roles found
                    validation:
                        required_if_not_hidden: Please select a role
                at_location:
                    indent: 2
                    hide_with_previous_field: true
                    type: radios
                    value: any
                    values:
                        any:
                            label: at ANY location
                        in_url:
                            label: at the location in the URL
                        detect:
                            label: at the location in the URL, or at ANY location when there is no location in the URL
                module_class_name:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    visible_if: >
                        zenarioAB.value('privacy') == 'call_static_method'
                    label: 'Module class name:'
                    type: text
                    maxlength: 200
                method_name:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_with_previous_field: true
                    label: 'Static method name:'
                    type: text
                    maxlength: 127
                param_1:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_with_previous_field: true
                    label: 'Parameter 1:'
                    type: text
                    maxlength: 255
                param_2:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_with_previous_field: true
                    label: 'Parameter 2:'
                    type: text
                    maxlength: 255
                
                privacy_part_2:
                    indent: 1
                    hide_with_previous_indented_field: true
                    snippet:
                        show_split_values_from: privacy
                
                always_visible_to_admins:
                    indent: 2
                    hide_with_previous_outdented_field: true
                    visible_if: >
                        zenarioAB.value('privacy') && zenarioAB.value('privacy') != 'public'
                    label: Ignore the above rules when logged in as an administrator.
                    type: checkbox
                    value: 1
                
                
                css_class:
                    label: 'CSS class names:'
                    type: text
                    maxlength: 100
    lovs:
        title_merge_fields: {}
