# You must use a tab-size of 4 spaces to edit this file.
---
zenario__library:
    panels:
        conductor:
            panel_type: network_graph
            key:
                instanceId: ''
            #db_items:
            #    table: |
            #        [[DB_PREFIX]]nested_plugins AS np
            #        LEFT JOIN [[DB_PREFIX]]nested_plugins AS p
            #           ON p.instance_id = np.instance_id
            #          AND p.is_slide = 1
            #          AND p.slide_num = np.slide_num
            #    id_column: np.id
            refiners:
                from_nested_plugins:
                    sql: 'np.instance_id = [[REFINER__NEST]]'
            refiner_required: true
            disable_periodic_refresh: true
                    
            columns:
                id:
                    title: Id
                label:
                    title: Name
                    show_by_default: true
                dummy_column_for_filter:
                    hidden: true
                    format: enum
                    values:
                        show_vars: {}

            #item:
            #    name: Nested slide/plugin
            #    names: Nested slides and plugins
            #    tooltip: >
            #        To reorder items, simply drag and drop.
            #        Changes will take effect immediately.
            
            
            cytoscape: {}
            quick_filter_buttons:
                show_labels: 
                    label: Show labels and commands
                    column: dummy_column_for_filter
                    value: ''
                    remove_filter: true
                show_vars: 
                    visible_if: |
                        zenarioT.showDevTools()
                    label: Show variables
                    column: dummy_column_for_filter
                    value: show_vars
                    tooltip: |
                        The variables shown here are defined in the description.yaml file of the
                        modules.
                        <br/><br/>
                        To add a variable to a path, a module developer should edit the
                        description.yaml file of the module that the path is for.
                        <br/><br/>
                        If you have created a custom path, you will need to manually enter the variables
                        used in the path's properties.
            
            collection_buttons:
                do_save_positions:
                    hidden: true
                    ajax:
                        request:
                            save_positions: 1
                save_positions:
                    css_class: organizer_applyButton
                    only_show_on_refiner: from_nested_plugins
                    visible_if: |
                        zenarioO.tuix.positionsChanged
                    label: 💾 Save positions
                    onclick: |
                        zenarioO.collectionButtonClick('do_save_positions', {positions: JSON.stringify(zenarioO.tuix.positions)});
                #reset_positions:
                #    only_show_on_refiner: from_nested_plugins
                #    visible_if: |
                #        !_.isEmpty(zenarioO.tuix.positions)
                #    label: ✘ Reset positions
                #    ajax:
                #        confirm:
                #            button_message: Reset positions
                #            cancel_button_message: Cancel
                #            message_type: warning
                #            message: |
                #                This will auto-arrange all of the nodes, clearing the saved positions.
                #                
                #                Are you sure you wish to continue?
                #        request:
                #            reset_positions: 1
            item_buttons:
                tab_settings:
                    only_show_on_refiner: from_nested_plugins
                    label: Slide [[slide_num]] properties
                    visible_if: |
                        item.key && item.key.slideId
                    admin_box:
                        path: zenario_slide
                add_path:
                    only_show_on_refiner: from_nested_plugins
                    label: Add path to...
                    visible_if: |
                        item.key && item.key.state
                    hide_when_children_are_not_visible: true
                add_path_to_citem:
                    parent: add_path
                    ord: 9999
                    label: Another content item...
                    admin_box:
                        path: zenario_path
                        key:
                            linkToOtherContentItem: true
                
                path_properties:
                    only_show_on_refiner: from_nested_plugins
                    label: Path properties
                    visible_if: |
                        item.type == 'path'
                    admin_box:
                        path: zenario_path
                        key:
                            linkToOtherContentItem: autodetect
                redirect_path:
                    only_show_on_refiner: from_nested_plugins
                    label: Redirect path to...
                    visible_if: |
                        item.type == 'path'
                    hide_when_children_are_not_visible: true
                redirect_path_to_citem:
                    parent: redirect_path
                    ord: 9999
                    label: Another content item...
                    admin_box:
                        path: zenario_path
                        key:
                            linkToOtherContentItem: true
                    
                delete_path:
                    only_show_on_refiner: from_nested_plugins
                    label: Delete path
                    visible_if: |
                        item.type == 'path'
                    ajax:
                        request:
                            delete_path: 1
                        confirm:
                            html: true
                            button_message: Delete
                            cancel_button_message: Cancel
                            message_type: warning
                            message: |
                                <p>Delete the [[selected_label]]?</p>
                                <p>This will immediately delete the path and cannot be undone.</p>
                
                advanced:
                    label: Advanced...
                    hide_when_children_are_not_visible: true
                add_state:
                    parent: advanced
                    only_show_on_refiner: from_nested_plugins
                    label: Add alternate state to slide [[slide_num]]
                    visible_if: |
                        item.key && item.key.slideId
                    ajax:
                        request:
                            add_state: 1
                delete_state:
                    parent: advanced
                    only_show_on_refiner: from_nested_plugins
                    label: Delete alternate state [[state]] from slide [[slide_num]]
                    visible_if: |
                        item.type == 'state' && item.can_delete
                    ajax:
                        request:
                            delete_state: 1
                        confirm:
                            html: true
                            button_message: Delete
                            cancel_button_message: Cancel
                            message_type: warning
                            message: |
                                <p>Delete state [[label]]?</p>
                                <p>This will immediately delete the state, as well as any paths that lead to and from it, and cannot be undone.</p>
