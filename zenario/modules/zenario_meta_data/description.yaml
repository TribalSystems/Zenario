---
author_name: Tribal Systems
copyright_info: © Tribal Limited
editions: Community, Pro, ProBusiness, Enterprise
start_running_on_install: true
license_info: 'Modified BSD License'
display_name: Metadata
description: |
            <p>
            Displays the metadata of the current content item, such as:
                <ul>
                    <li>Browser title</li>
                    <li>Release date</li>
                    <li>Categories</li>
                    <li>Description</li>
                    <li>Summary</li>
                    <li>Keywords</li>
                    <li>Language</li>
                    <li>Language code</li>
                    <li>Featured image</li>
                    <li>Writer name</li>
                    <li>Writer image</li>
                    </ul>
                </p>
            <p>
                For example, you may want to show the release date on all of your News content items. To do 
                this, place a plugin of this module on a layout that is used for news item, and configure its settings to 
                show release date.
            </p>
            <p>
                If you select Categories in the plugin's settings, the plugin will display a list of 
                the public categories of the content item in alphabetical order. (Categories not marked 
                as public are treated as internal categories only and will not be shown to visitors.)
            </p>
category: pluggable

# Reminder: you need to increment the LATEST_REVISION_NO in this module's
# latest_revision_no.inc.php file if you change any of the fields below:
vlp_class_name: zenario_meta_data
css_class_name: zenario_meta_data
is_pluggable: true
can_be_version_controlled: false
can_be_plugged_into:
    content_items: false
    layouts: true
    regular_nests: false
    slideshows: false
    ajax_nests_without_conductor: false
    ajax_nests_with_conductor: false
default_framework: standard
default_instance_name: Content Item Metadata
