---
author_name: Tribal Systems
copyright_info: © Tribal Limited
editions: Community, Pro, ProBusiness, Enterprise
start_running_on_install: true
license_info: 'Modified BSD License'
display_name: Slideshow
description: |
    <p>
        This module allows you to create a slideshow of images with animated transitions.
    </p><p>
        You can create dynamic effects for your visitors, controlling all aspects of display and slide transitions.
        The slides can auto-advance after a set delay, or slides can be set to only advance when a visitor clicks Next or Prev.
    </p><p>
        Animation effects are available via the
           <a href="http://malsup.com/jquery/cycle/" target="_blank">jQuery Cycle</a> or
           <a href="https://swiperjs.com/" target="_blank">Swiper</a>
          libraries (you can choose which you want in the slideshow's settings).
    </p><p>
        Each image can have a hyperlink and text/HTML, plus personalisation controls.
    </p>
category: pluggable
keywords: >
    masthead, callout, call-out, document, download, image,
    picture, gif, jpg, jpeg, png, link, hyperlink, url

# Reminder: you need to increment the LATEST_REVISION_NO in this module's
# latest_revision_no.inc.php file if you change any of the fields below:
vlp_class_name: zenario_slideshow
css_class_name: zenario_slideshow
is_pluggable: true
nestable: false
can_be_version_controlled: false
default_framework: standard
default_instance_name: Untitled Slideshow
dependencies:
    zenario_abstract_nest: true
