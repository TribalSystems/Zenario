# You must use a tab-size of 4 spaces to edit this file.
---
zenario_videos_manager__video:

    
    # The identifier property displays the Video Id.
    identifier: 
        css_class: zenario_videos_manager_item
        label: "Video ID: "
    key:
        id: ""
        from_video_upload: ""
        thumbnail_id_on_load: 0
    title: Add a video by URL
    tabs:
        details:
            label: Details
            edit_mode:
                enabled: true
            fields:
                url:
                    label: 'URL:'
                    type: text
                    maxlength: 255
                    note_below: Enter a URL on YouTube, e.g. https://youtu.be/12345 or Vimeo, e.g. https://vimeo.com/12345 or https://vimeo.com/12345/98765 if the video is unlisted. You can then press the "Fetch" button to get the video's thumbnail and descriptive text.
                    row_class: zenario_row_full_width_field
                    onclick: "if ($(this).val()=='') {$(this).val('https://')}"
                    validation:
                        required: "Please enter a URL."
                    format_onchange: true
                url_test:
                    same_row: Yes
                    type: button
                    css_class: zenario_gp_button
                    value: Test
                    dataset_label: '[URL test button]'
                    onclick: "if ($(lib.get('url')).val()!='') {window.open($(lib.get('url')).val())}"
                fetch_youtube_details:
                    type: button
                    css_class: zenario_gp_button
                    value: Fetch YouTube details
                    dataset_label: '[Fetch YouTube details button]'
                    format_onchange: true
                    hidden: true
                fetch_vimeo_details:
                    type: button
                    css_class: zenario_gp_button
                    value: Fetch Vimeo details
                    dataset_label: '[Fetch Vimeo details button]'
                    format_onchange: true
                    hidden: true
                start_time:
                    label: 'Start time (optional):'
                    type: text
                    maxlength: 30
                    style: "width: 20em;"
                    notices_below:
                        start_time_info:
                            type: information
                            show: true
                            message: |
                                You may enter an additional start time argument.
                                For example, for YouTube, enter "t=120" to start the video 2 minutes in.
                                For Vimeo, enter "t=2m" to start the video 2 minutes in.
                video_privacy:
                    label: "Privacy (applies to Vimeo only):"
                    snippet:
                        html: ""
                image:
                    label: 'Image (public):'
                    upload:
                        accept: 'image/*'
                        extensions:
                            - .gif
                            - .jpg
                            - .jpeg
                            - .png
                        drag_and_drop: true
                    row_class: zenario_row_full_width_field
                title:
                    label: 'Title:'
                    type: text
                    maxlength: 255
                    validation:
                        required: "Please enter a title."
                    row_class: zenario_row_full_width_field
                short_description:
                    label: 'Short description (plain text):'
                    type: textarea
                    rows: 3
                    row_class: zenario_row_full_width_field
                description:
                    label: 'Full description (HTML):'
                    type: editor
                    editor_type: description_editor
                date:
                    label: 'Date:'
                    type: date
                    change_month_and_year: true
                    allow_typing_in_date_field: true
                    show_date_format_as_placeholder: true
                language_id:
                    label: "Language:"
                    type: select
                    empty_value: '-- Select --'
                    values: {}
                    hidden: true
                    validation:
                        required_if_not_hidden: "Please select a language."
                categories:
                    label: 'Categories:'
                    type: checkboxes
                no_categories:
                    label: 'Categories:'
                    snippet:
                        html: ''
                    hidden: true