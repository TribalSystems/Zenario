---
display_name: Nest
author_name: Tribal Systems
copyright_info: © Tribal Limited
editions: Community, Pro, ProBusiness, Enterprise
start_running_on_install: true  # N.b. changing this property won't do anything as this module is hard-coded in the installer to run on install.
license_info: 'Modified BSD License'
description: |
    <p>
        This Module allows you to set up and manage a collection of multiple plugins inside the same slot (which is called a nest).
        Any plugin that is marked as &quot;nestable&quot; in its description may placed inside.
    </p><p>
         Nests have multiple slides, with one or more plugins on each slide.
         There may be tabs on the slides with editable labels and images,
         or there may be forward/back progress indicators and buttons, or some combination of these things.
    </p><p>
        The size of plugins can be controlled, so that they can span the full width of the slot,
        or some number of columns in the GridMaker system.
        This means that when a slide has several plugins, those plugins can appear side by side (on desktop),
        or can be stacked vertically.
    </p><p>
        When a visitor changes from one slide to another, the transition can be made when the user clicks or tabs.
        But options are available whereby transitions can be automatic.
        This makes a nest similar slideshow, but note that it's usually better to use the Slideshow module
        if the aim is to show one image at a time in an auto-advancing slideshow.
    </p><p>
        Importantly for search engine optimisation (SEO), the content generated by all plugins on all slides
        of a nest is readable by search engine crawlers.
        This is because all of the slides are preloaded on the client, and transitions are implemented using JavaScript.
    </p>
category: pluggable
keywords: >
    banner, graphic, masthead, movie, panel, play, show, slide,
    slider

# Reminder: you need to increment the LATEST_REVISION_NO in this module's
# latest_revision_no.inc.php file if you change any of the fields below:
vlp_class_name: zenario_nest
css_class_name: zenario_plugin_nest
default_framework: standard
is_pluggable: true
can_be_version_controlled: false
can_be_plugged_into:
    content_items: true
    layouts: true
    regular_nests: false
    slideshows: false
    ajax_nests_without_conductor: false
    ajax_nests_with_conductor: false
default_instance_name: Untitled Nest

# Warning: adding a new dependency to an existing module will break any existing sites
# where the dependency is not running.
# You can fix this on a per-site basis by manually running the dependency, i.e. by running
#   UPDATE zenario_modules SET status = 'module_running' WHERE class_name = 'dependency'
# in MySQL and then going to /admin/ to apply database updates.
# If this is a core module, consider using runNewModuleDependency() in a 
