license_info: 'Modified BSD License'
display_name: Multiple Image Container
description: |
    <p>Image galleries can easily be created using Multiple Image Container ("MIC") module. Create an MIC plugin for each gallery page required, and insrt it into a slot on the content item.</p>
    
    <p>Images can be uploaded into the plugin in JPG or PNG format (for best quality), or GIF (lesser quality but may be animated).</p>
    
    <p>In Organizer, there will be an MIC Images panel in the Library area, in which administrators can manage all MIC images in one place.</p>
   
    <p>When uploading images, you may upload over-sized images, and Zenario will automatically resize and cache images at the size specified in the MIC plugin settings.</p>
    
    <p>Various gallery styles are possible, and these are determined in CSS. When visitors view the gallery, the usual behaviour is that they see thumbnails initially, and can click on a thumbnail to see it at a larger size.</p>
category: pluggable
keywords: >
    mic, gallery, image, picture, gif, jpg, jpeg, png

# Reminder: you need to increment the LATEST_REVISION_NO in this module's
# latest_revision_no.inc.php file if you change any of the fields below:
vlp_class_name: zenario_multiple_image_container
is_pluggable: true
can_be_version_controlled: false
nestable: true
default_framework: standard
default_instance_name: Untitled Multiple Image Container
