---
author_name: Tribal Systems
copyright_info: © Tribal Limited
editions: Pro, ProBusiness, Enterprise
start_running_on_install: false
license_info: 'Modified BSD License'
display_name: Extranet Base Module and Login
description: |
    <p>This is the base module for creating an extranet, a secure area for authorised extranet users. It creates a plugin which is the login interface for users.</p>
    <p>When started, this module automatically creates a "Login" special page, and puts a plugin on that page. Certain features get enabled in different parts of Zenario, such as the ability to set permissions on a content item.</p>
    <h3>Various options</h3>
    <p>Please check the "User and Contact data" site setting, which determines various options, such as whether users should be able to log in using their email address or with a screen name.</p>
    <p>The plugin of this module also contains many options, such as what links to other pages it should show, like the password-reset page.</p>
    <p>After logging in, a user can in the simplest setup be automatically redirected to a "Welcome" page, while for more advanced setups the user can be redirected to a page based on what group they are a member of.</p>
    <h3>Other extranet modules</h3>
    <p>There are further extranet modules, for Registration, Password Reset, Change Password, Change Email, Edit Profile and Logout. These will normally be required for a fully-featured extranet.</p>
    <p>Zenario can also support roles (the relationship of users with locations), via the Organization Manager module.</p>
category: management
keywords: base, extranet, login, password, private, user, users

# Reminder: you need to increment the LATEST_REVISION_NO in this module's
# latest_revision_no.inc.php file if you change any of the fields below:
vlp_class_name: zenario_extranet
css_class_name: zenario_extranet
is_pluggable: true
plugin_must_be_on_public_page: true
can_be_plugged_into:
    content_items: true
    layouts: false
    regular_nests: false
    slideshows: false
    ajax_nests_without_conductor: false
    ajax_nests_with_conductor: false
default_framework: standard
special_pages:
    special_page:
        page_type: zenario_login
        default_alias: login
        default_title: Login
        only_show_to_visitors_who_are_logged_out: true
        logic: create_and_maintain_in_default_language
        allow_hide: true

# Warning: adding a new dependency to an existing module will break any existing sites
# where the dependency is not running.
# You can fix this on a per-site basis by manually running the dependency, i.e. by running
#   UPDATE zenario_modules SET status = 'module_running' WHERE class_name = 'dependency'
# in MySQL and then going to /admin/ to apply database updates.
# If this is a core module, consider using runNewModuleDependency() in a 
# database-revision in zenario/admin/db_updates/step_4_migrate_the_data/plugins.inc.php
# to fix it automatically for every site.
dependencies:
    zenario_users: true
default_instance_name: Extranet Login
