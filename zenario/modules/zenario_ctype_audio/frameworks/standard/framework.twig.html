{% if mp3 %}
	<p class="audio_title">{{title|e}}</p>
	{% if size %}
		<p class="audio_size">{{"File size:"|trans}} {{size|e}}</p>
	{% endif %}
	<audio src="{{mp3Path}}" controls
		{% if autostart %} autoplay {% endif %}
		{% if loop %} loop {% endif %}
	>
		Your browser does not support the <code>audio</code> element.
	</audio>
{% endif %}
