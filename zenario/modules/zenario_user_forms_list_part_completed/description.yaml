---
author_name: Tribal Systems
copyright_info: © Tribal Limited
editions: Pro, ProBusiness, Enterprise
start_running_on_install: false
license_info: 'Modified BSD License'
display_name: Form Container (List of Part-Completed Forms)
description: |
    <p>
        This module lets extranet users view a list of forms which they started filling in and saved for later.
    </p><p>
        It will display the title of the page where the form can be found, the date and time of their saved response, and a clickable link to resume.
    </p><p>
        A form must first be visited on the front-end by a logged in admin at least once before the page can be recorded as a plugin page for the selected form.
    </p><p>
        The plugin must be put on a password-protected content item.
    </p>
category: management
keywords: form, forms, profile, user, data view, complete, completed, part

# Reminder: you need to increment the LATEST_REVISION_NO in this module's
# latest_revision_no.inc.php file if you change any of the fields below:
vlp_class_name: zenario_user_forms_list_part_completed
css_class_name: zenario_user_forms_list_part_completed
is_pluggable: true
plugin_must_be_on_private_page: true
can_be_version_controlled: false
can_be_plugged_into:
    content_items: true
    layouts: false
    regular_nests: false
    slideshows: false
    ajax_nests_without_conductor: false
    ajax_nests_with_conductor: false
default_framework: standard

# Warning: adding a new dependency to an existing module will break any existing sites
# where the dependency is not running.
# You can fix this on a per-site basis by manually running the dependency, i.e. by running
#   UPDATE zenario_modules SET status = 'module_running' WHERE class_name = 'dependency'
# in MySQL and then going to /admin/ to apply database updates.
# If this is a core module, consider using runNewModuleDependency() in a 
# database-revision in zenario/admin/db_updates/step_4_migrate_the_data/plugins.inc.php
# to fix it automatically for every site.
dependencies:
    zenario_users: true
    zenario_extranet: true
    zenario_user_forms: true
default_instance_name: Part-completed forms list