zenario_list_videos:
    fea_type: list
    key:
        id: ''
        view: blocks
    microtemplate: fea_list_blocks
    css_class: zfea_block_like_block
    title: Videos
    no_items_message: No videos found
    hide_search_bar: true
    columns:
        image:
            tag: div
            html: true
        title:
            title: Video title
        description:
            title: Description
            html: true
        date:
            title: Date
    item_buttons:
        view:
            visible_if: |
                tuix.enable.view_video && lib.navigationEnabled('view_video')
            label: View
            go:
                command: view_video
            show_as_link_on_column:
                image: true
                title: true
        edit:
            visible_if: |
                tuix.enable.edit_video && lib.navigationEnabled('edit_video') && tuix.perms.manage
            css_class: small_button edit
            label: Edit
            go:
                command: edit_video
    collection_buttons:
        new:
            visible_if: |
                tuix.enable.new_video && lib.navigationEnabled('new_video') && tuix.perms.manage
            css_class: small_button create
            icon_left: fa fa-plus
            location: top
            label: New video
            go:
                mode: new_video
                command: new_video
        block_view:
            css_class: small_button block_view_button
            icon_left: fa-solid fa-grip
            location: top
            label: View as blocks
            go:
                view: blocks
        list_view:
            css_class: small_button list_view_button
            icon_left: fa-solid fa-bars
            location: top
            label: View as list
            go:
                view: list