# You must use a tab-size of 4 spaces to edit this file.
---
zenario__menu:
    nav:
        #If there's only one language enabled, show an "Edit sections" link
        #to the menu sections panel so admins can still create/edit/delete them.
        menu_sections:
            ord: 999999
            separator_before_this: true
            css_class: menu_section_edit
            label: Menu sections
            tooltip: >
                (Advanced) Menu navigation is divided into "sections", i.e. the visual navigation areas on each page. Edit menu sections here.
            link:
                path: ''
    panels:
        sections:
            collection_buttons:
                create:
                    priv: _PRIV_CREATE_DELETE_MENU_SECTION
                    css_class: zenario_create_a_new
                    hide_on_filter: true
                    label: Create a menu section
                    hide_in_select_mode: true
                    admin_box:
                        path: zenario_menu_section
            item_buttons:
                rename:
                    priv: _PRIV_CREATE_DELETE_MENU_SECTION
                    label: Rename section
                    ord: 5
                    hide_in_select_mode: true
                    admin_box:
                        path: zenario_menu_section
                    disabled_if: item.name == 'Main'
                    disabled_tooltip: |
                      You cannot rename the menu section "Main".
                delete:
                    priv: _PRIV_CREATE_DELETE_MENU_SECTION
                    label: Delete section
                    ord: 10
                    hide_in_select_mode: true
                    ajax:
                        confirm:
                            message: 'Are you sure you wish to delete the menu section "[[name]]"?'
                            button_message: Delete
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            delete_menu_section: 1
                    disabled_if: !item.empty
                    disabled_tooltip: "A menu section may only be deleted if there are no menu nodes in it."
        menu_nodes:
            columns:
                zenario_pro_features__invisible:
                    visible_if: |
                        zenarioO.searchTerm !== undefined
                    show_by_default: true
                    title: Invisible
                    format: yes_or_no
                    yes_phrase: Invisible
                    no_phrase: ''
                    db_column: mi.invisible

            item_buttons:
                make_menu_node_invisible:
                    priv: _PRIV_CREATE_DELETE_MENU_SECTION
                    parent: action_dropdown
                    ord: make_primary + 0.1
                    label: Make menu node invisible
                    multiple_select_label: Make menu nodes invisible
                    multiple_select: true
                    hide_in_select_mode: true
                    ajax:
                        confirm:
                            #The confirmation message is created in the PHP class file.
                            button_message: Make invisible
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            make_invisible: 1
                    visible_if_for_any_selected_items: (!item.ghost && !item.invisible)
                make_menu_node_visible:
                    priv: _PRIV_CREATE_DELETE_MENU_SECTION
                    parent: action_dropdown
                    ord: make_primary + 0.2
                    label: Make menu node visible
                    multiple_select_label: Make menu nodes visible
                    multiple_select: true
                    hide_in_select_mode: true
                    ajax:
                        confirm:
                            #The confirmation message is created in the PHP class file.
                            button_message: Make visible
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            make_visible: 1
                    visible_if_for_any_selected_items: (!item.ghost && item.invisible)