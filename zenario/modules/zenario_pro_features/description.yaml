---
author_name: Tribal Systems
copyright_info: © Tribal Limited
editions: Pro, ProBusiness, Enterprise
start_running_on_install: true
license_info: 'Modified BSD License'
display_name: Pro Features
description: |
            <p><b>Menus</b></p>        
        
            <p>
                With the Pro Features module, you can create new menu sections beyond the standard "Main" and "Footer". This enables sites to have better navigation, such as having a top menu bar, sub-sections of a site, or extranet-related menu navigation.
            </p>
            
            <p>
                Pro allows menu nodes to be made invisible, thereby allowing a menu node to exist in the menu hierarchy (and have a breadcrumb trail), but without it appearing in menu navigation. This can be helpful on large sites, such as those with a lot of news or blog items.
            </p>
                        
            <p><b>Country-based Landing Pages</b></p>
            
            <p>The Pro Features module supports geographical landing pages. You must also have the Geo Landing Pages module running to enable this feature.</p>
            
            <p>This feature allows the site to detect a visitor's location and set a landing page or country selection accordingly. This can further be used with Nests to hide or reveal slides according to the visitor's location.</p>
            
category: core

# Warning: adding a new dependency to an existing module will break any existing sites
# where the dependency is not running.
# You can fix this on a per-site basis by manually running the dependency, i.e. by running
#   UPDATE zenario_modules SET status = 'module_running' WHERE class_name = 'dependency'
# in MySQL and then going to /admin/ to apply database updates.
# If this is a core module, consider using runNewModuleDependency() in a 
# database-revision in zenario/admin/db_updates/step_4_migrate_the_data/plugins.inc.php
# to fix it automatically for every site.
dependencies:
    zenario_common_features: true

# Reminder: you need to increment the LATEST_REVISION_NO in this module's
# latest_revision_no.inc.php file if you change any of the fields below:
is_pluggable: false
can_be_version_controlled: false
signals:
    signal1:
        name: eventContentDeleted
        static: true
    signal2:
        name: eventContentTrashed
        static: true
