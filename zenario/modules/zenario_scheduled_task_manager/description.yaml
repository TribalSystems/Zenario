display_name: Scheduled Task Manager
description: |
            <p>
                The Scheduled Task Manager provides support for other modules to run regular tasks at predefined times.
            </p>
            <p>
                It requires a Linux or Un*x-based server with support for crontabs and PHP from the command line (PHPCLI).
                To install it, go to the Scheduled Tasks panel in Organizer, from where an administrator can copy the required line of text
                and paste it into the server's crontab.
                Once this has been done, the Scheduled Task Manager will run once per minute, and then call the appropriate module when required, typically once per day. 
            </p>
            <p>
                You can determine the times and days when a Scheduled Task runs. You can determine the level of logging, and ask for activity reports by email. 
            </p>
