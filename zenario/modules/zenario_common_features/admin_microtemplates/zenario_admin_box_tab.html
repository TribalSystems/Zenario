<div
	id="afb_tab_{{m.tabId|escape}}"
	class="
		{{m.current? 'current' : ''}}
		{{m.onclick? 'zenario_fab_tab_with_fields' : 'zenario_fab_tab_with_no_fields'}}
		{{m.children? 'zenario_fab_tab_with_child' : 'zenario_fab_tab_no_child'}}
		{{m.childCurrent? 'zenario_fab_tab_with_current_child' : ''}}
	"
><div>
	<a href="#" onclick="{{m.onclick|escape}} return false;">
		{{m.label|escape}}
	</a>
	<% if (m.children_in_use) { %>
		<span class="afb_tab_in_use_count zenario_item_record_count">{{m.children_used|e}}</span>
	<% } %>
	<% if (m.children) { %>
		<ul>{{m.lib.microTemplate('zenario_admin_box_tab_children', m.children)}}</ul>
	<% } %>
</div></div>
