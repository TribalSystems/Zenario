<div id="organizer_dataset_tab_{{m.name|e}}" class="dataset_tab">
	<!--<h4>{{m.label|e}}</h4>-->
</div>
<div id="organizer_dataset_tab_fields_{{m.name|e}}" class="dataset_fields">
	<% if (m.fields.length > 0) { %>
		<% var tabLabel; %>
		<% if (m.label) { %>
			<% tabLabel = m.label; %>
		<% } else { %>
			<% tabLabel = m.default_label; %>
		<% } %>
		<p>Dataset tab: {{tabLabel|e}}</p>
		{{zenarioT.microTemplate('zenario_organizer_form_builder_dataset_field', m.fields)}}
	<% } %>
</div>
