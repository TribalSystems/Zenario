<div class="
	organizer_item second_level_item
	{{m.css_class|escape}}
	
	<% if (m.separator_before_this) { %>
		zenario_separator_before_this
	<% } %>
	<% if (m.separator_after_this) { %>
		zenario_separator_after_this
	<% } %>
	<% if (m.new_window) { %>
		zenario_nav_link_new_window
	<% } %>
">
	<div class="organizer_legend {{m.selected? 'legend_on' : ''|escape}}">
		<a title="{{m.tooltip|escape}}"
			href="{{m.href|escape}}"
			onclick="{{m.onclick|escape}}"
			
			<% if (m.new_window) { %>
				target="_blank"
			<% } %>
		>
				<span>{{m.label|escape}}</span>
		</a>
	</div>
</div>
