# You must use a tab-size of 4 spaces to edit this file.
---
full_slot:
    css_class: zenario_slotOuter zenario_slotWithContents
    meta_info:
        is_header: false
        is_footer: false
        is_sitewide: false
    info:
        edit_sc_title:
            label: 'Slot inspector'
            css_class: zenario_slotControl_title
            page_modes:
                edit: true
        layout_sc_title:
            label: Layout slot inspector
            css_class: zenario_slotControl_title
            page_modes:
                layout: true
        locked:
            css_class: zenario_slotControl_locked
            page_modes:
                edit: true
            label: This content item is locked by another administrator.
        slot_name_in_edit_mode:
            css_class: zenario_slotControl_slotName
            page_modes:
                edit: true
        slot_name_in_layout_mode:
            css_class: zenario_slotControl_slotName
            page_modes:
                layout: true
        #We've hidden the plugin and slot's CSS classes for now to reduce clutter.
        #grid_css_class:
        #    css_class: zenario_slotControl_cssClass
        #    page_modes:
        #        edit: true
        #        layout: true
        #    label: 'CSS classes: <span></span>'
        #grid_width:
        #    css_class: zenario_slotControl_width
        #    page_modes:
        #        edit: true
        #        layout: true
        #    label: 'Width: <span></span>'
        #We've hidden the embed link for now to reduce clutter.
        #If we ever add some sort of "more options" toggle, we might add it back.
        #embed:
        #    css_class: zenario_slotControl_copyEmbedLink
        #    label: 'Embed:'
        #    page_modes:
        #        edit: true
        #        layout: true
        in_this_slot:
            css_class: zenario_slotControl_inThisSlot
            label: 'This slot:'
            page_modes:
                edit: true
                layout: true
        module_name:
            css_class: zenario_slotControl_module
            page_modes:
                edit: true
                layout: true
        vc:
            css_class: zenario_slotControl_vc
            label: 'Version-controlled'
            page_modes:
                edit: true
        vc_warning:
            css_class: zenario_slotControl_vc
            label: 'Version-controlled; use Content item view to edit content.'
            page_modes:
                layout: true
        reusable_plugin_details:
            css_class: zenario_slotControl_reusable zenario_slotControl_reusablePluginDetails
            page_modes:
                edit: true
                layout: true
        #We've hidden the plugin and slot's CSS classes for now to reduce clutter.
        #slot_css_class:
        #    css_class: zenario_slotControl_cssClass
        #    page_modes:
        #        edit: true
        #        layout: true
        plugin_images:
            css_class: zenario_slotControl_pluginImages
            hidden: true
            page_modes:
                edit: true
                layout: true
        menu_section:
            css_class: zenario_slotControl_menuSection
            hidden: true
            page_modes:
                edit: true
                layout: true
        mobile:
            css_class: zenario_slotControl_onlyMobile
            label: Only shown on mobile
            page_modes:
                edit: true
                layout: true
        desktop:
            css_class: zenario_slotControl_onlyDesktop
            label: Only shown on desktop
            page_modes:
                edit: true
                layout: true
    actions:
        settings:
            label:
                normal: Edit contents
                cant_make_draft: View contents
                trashed: View content (to edit, click Re-draft)
                hidden: View content (to edit, click Re-draft)
                settings: Edit plugin settings
                view_settings: View plugin settings
            locked_label: View contents
            onclick: return zenarioA.pluginSlotEditSettings(this, slotName);
        
        # The old "CSS & framework" button, commented out now as it has been merged back into the plugin settings
        #framework_and_css:
        #    label: 'CSS & framework'
        #    locked_label: 'View CSS & framework'
        #    onclick: return zenarioA.pluginSlotEditSettings(this, slotName, 'plugin_css_and_framework');
        
    
    re_move_place:
        move_on_item_layer:
            page_modes:
                edit: true
            onclick: |
                if (zenarioA.draft(this.id)) {
                    zenarioA.movePlugin(this, slotName);
                }
                return false;
            label: Move ~plugin~ on this content item
        move_on_layout_layer:
            page_modes:
                layout: true
            onclick: return zenarioA.movePlugin(this, slotName);
            label: Move ~plugin~ on this layout
        
        copy_plugin_placement_on_item_layer:
            page_modes:
                edit: true
            onclick: |
                if (zenarioA.draft(this.id)) {
                    zenarioA.movePlugin(this, slotName, false, true);
                }
                return false;
            label: Copy ~plugin~ on this content item
        
        
        replace_reusable_on_item_layer:
            priv: _PRIV_MANAGE_ITEM_SLOT
            label: Override with a plugin
            label_like4like: Override with a different plugin
            label_replace: Replace with a plugin
            label_replace_like4like: Replace with a different plugin
            page_modes:
                edit: true
            # In Zenario 10.1 we're experimenting with showing some options in a FAB
            # instead of directly in the slot drop-down, to reduce clutter
            #onclick: |
            #    if (zenarioA.draft(this.id)) {
            #        zenarioAT.clickTab('edit');
            #        zenarioA.pickNewPlugin(this, slotName, 1, false, [[preselectCurrentChoice]]);
            #    }
            #    return false;
            show_as_option_in_fab: true
            pick_new_plugin:
                level: 1
                is_nest: false
        
        replace_nest_on_item_layer:
            hidden: true    # N.b. this will be unhidden if a nest module is running
            priv: _PRIV_MANAGE_ITEM_SLOT
            label: Override with a nest
            label_like4like: Override with another nest
            label_replace: Replace with a nest
            label_replace_like4like: Replace with another nest
            page_modes:
                edit: true
            # In Zenario 10.1 we're experimenting with showing some options in a FAB
            # instead of directly in the slot drop-down, to reduce clutter
            #onclick: |
            #    if (zenarioA.draft(this.id)) {
            #        zenarioAT.clickTab('edit');
            #        zenarioA.pickNewPlugin(this, slotName, 1, true, [[preselectCurrentChoice]]);
            #    }
            #    return false;
            show_as_option_in_fab: true
            pick_new_plugin:
                level: 1
                is_nest: true
        
        replace_slideshow_on_item_layer:
            hidden: true    # N.b. this will be unhidden if a slideshow module is running
            priv: _PRIV_MANAGE_ITEM_SLOT
            label: Override with a slideshow
            label_like4like: Override with another slideshow
            label_replace: Replace with a slideshow
            label_replace_like4like: Replace with another slideshow
            page_modes:
                edit: true
            # In Zenario 10.1 we're experimenting with showing some options in a FAB
            # instead of directly in the slot drop-down, to reduce clutter
            #onclick: |
            #    if (zenarioA.draft(this.id)) {
            #        zenarioAT.clickTab('edit');
            #        zenarioA.pickNewPlugin(this, slotName, 1, 'slideshow', [[preselectCurrentChoice]]);
            #    }
            #    return false;
            show_as_option_in_fab: true
            pick_new_plugin:
                level: 1
                is_nest: 'slideshow'
        
        hide_plugin:
            page_modes:
                edit: true
            onclick: >
                if (zenarioA.draft(this.id, false, 'Are you sure you wish to show nothing on this content item?', 'Hide')) {
                    zenarioA.hidePlugin(this, slotName);
                }
                return false;
            label: Show nothing on this content item
        
        replace_reusable_on_layout_layer:
            priv: _PRIV_MANAGE_TEMPLATE_SLOT
            label: Replace with a plugin on this layout
            label_like4like: Replace with a different plugin on this layout
            page_modes:
                layout: true
            # In Zenario 10.1 we're experimenting with showing some options in a FAB
            # instead of directly in the slot drop-down, to reduce clutter
            #onclick: return zenarioA.pickNewPlugin(this, slotName, 2, false, [[preselectCurrentChoice]]);
            show_as_option_in_fab: true
            pick_new_plugin:
                level: 2
                is_nest: false
        
        replace_nest_on_layout_layer:
            hidden: true    # N.b. this will be unhidden if a nest module is running
            priv: _PRIV_MANAGE_TEMPLATE_SLOT
            label: Replace with a nest on this layout
            label_like4like: Replace with a different nest on this layout
            page_modes:
                layout: true
            # In Zenario 10.1 we're experimenting with showing some options in a FAB
            # instead of directly in the slot drop-down, to reduce clutter
            #onclick: return zenarioA.pickNewPlugin(this, slotName, 2, true, [[preselectCurrentChoice]]);
            show_as_option_in_fab: true
            pick_new_plugin:
                level: 2
                is_nest: true
        
        replace_slideshow_on_layout_layer:
            hidden: true    # N.b. this will be unhidden if a slideshow module is running
            priv: _PRIV_MANAGE_TEMPLATE_SLOT
            label: Replace with a slideshow on this layout
            label_like4like: Replace with a different slideshow on this layout
            page_modes:
                layout: true
            # In Zenario 10.1 we're experimenting with showing some options in a FAB
            # instead of directly in the slot drop-down, to reduce clutter
            #onclick: return zenarioA.pickNewPlugin(this, slotName, 2, 'slideshow', [[preselectCurrentChoice]]);
            show_as_option_in_fab: true
            pick_new_plugin:
                level: 2
                is_nest: 'slideshow'
        
        replace_fab_item_layer:
            priv: _PRIV_MANAGE_ITEM_SLOT
            page_modes:
                edit: true
            visible_if: zenarioA.canShowSlotOptionsInFAB(slotName, 're_move_place', 'edit');
            onclick: |
                if (zenarioA.draft(this.id)) {
                    zenarioAT.clickTab('edit');
                    zenarioA.showSlotOptionsInFAB(slotName, 're_move_place', 'edit');
                }
                return false;
            label: Override this ~plugin~ on this content item...
            label_replace: Replace with...
        
        replace_fab_layout_layer:
            priv: _PRIV_MANAGE_TEMPLATE_SLOT
            page_modes:
                layout: true
            visible_if: zenarioA.canShowSlotOptionsInFAB(slotName, 're_move_place', 'layout');
            onclick: return zenarioA.showSlotOptionsInFAB(slotName, 're_move_place', 'layout');
            label: Replace on this layout with...
        
        remove_from_item_layer:
            page_modes:
                edit: true
            onclick: >
                if (zenarioA.draft(this.id, false, 'Are you sure you wish to remove this ~plugin~ from this content item?', 'Remove')) {
                    zenarioA.removePlugin(this, slotName, 1);
                }
                return false;
            label: Remove ~plugin~ from this content item
        remove_from_layout_layer:
            page_modes:
                layout: true
            onclick: return zenarioA.removePlugin(this, slotName, 2);
            label: Remove ~plugin~ from this layout
    
    
    
    overridden_info:
        #desc:
        #    css_class: zenario_slotControl_Overridden
        #    label: 'On layout (overridden):'
        #    page_modes:
        #        edit: true
        #        layout: true
        in_this_slot:
            css_class: zenario_slotControl_inThisSlot
            label: 'This slot on this layout (overridden):'
            page_modes:
                edit: true
                layout: true
        module_name:
            css_class: zenario_slotControl_module
            page_modes:
                edit: true
                layout: true
        vc:
            css_class: zenario_slotControl_vc
            label: 'Version-controlled'
            page_modes:
                edit: true
                layout: true
        reusable_plugin_details:
            css_class: zenario_slotControl_reusable zenario_slotControl_reusablePluginDetails
            page_modes:
                edit: true
                layout: true
    overridden_actions:
        #show_plugin:
        #    ord: 89
        #    page_modes:
        #        edit: true
        #        layout: true
        #    onclick: >
        #        if (zenarioA.draft(this.id)) {
        #            zenarioA.showPlugin(this, slotName);
        #        }
        #        return false;
        #    label: Stop hiding ~plugin~ on this content item
        remove_from_layout_layer:
            ord: 92
            page_modes:
                layout: true
            onclick: return zenarioA.removePlugin(this, slotName, 2);
            label: Remove ~plugin~ from this layout
    no_perms:
        cant_design:
            page_modes:
                edit: true
            css_class: zenario_slotControl_no_perms
            label: 'Limited options: you lack Designer permission'
    switch_to:
        switch_to_edit:
            page_modes:
                layout: true
            onclick: return zenarioA.switchToolbarWithSlotControlsOpen(this, event, slotName, 'edit');
            label: Switch to Content item view to edit content
        switch_to_edit_settings:
            page_modes:
                layout: true
            onclick: return zenarioA.switchToolbarWithSlotControlsOpen(this, event, slotName, 'edit');
            label: Switch to Content item view to edit plugin settings
        switch_to_layout:
            page_modes:
                edit: true
            onclick: return zenarioA.switchToolbarWithSlotControlsOpen(this, event, slotName, 'layout');
            label: Switch to Layout view to edit plugin settings
