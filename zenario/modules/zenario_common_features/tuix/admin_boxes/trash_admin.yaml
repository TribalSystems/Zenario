# You must use a tab-size of 4 spaces to edit this file.
---
zenario_trash_admin:
    key:
        id: ''
    title: "Trashing administrator account"
    tabs:
        trash_admin:
            edit_mode:
                priv: _PRIV_DELETE_ADMIN
                enabled: true
            label: Details
            notices:
                trash_admin:
                    show: true
                    type: warning
                    message: |
                        Trash the administrator account "[[adminString]]"?
                        
                        The account will be preserved for audit trail purposes, but this person will no longer be able to log in.
                        
                        The email address and all permissions on the account will be removed.

                        This will not affect any user accounts.

                        You can view trashed accounts via the "trash can" icon.
            fields:
                dummy_field:
                    #This field exists to prevent a bug where the admin box does not load correctly, because there are no fields.
                    snippet:
                        html: ''
    hide_tab_bar: true
    save_button_message: Trash
    cancel_button_message: Cancel
