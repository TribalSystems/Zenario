# You must use a tab-size of 4 spaces to edit this file.
---
admin_copy_perms:
    priv: _PRIV_EDIT_ADMIN
    key:
        id: ''
    title: Copying administrator permissions to admin [[admin]]
    hide_tab_bar: true
    tabs:
        copy:
            edit_mode:
                enabled: true
            label: ''
            fields:
                desc:
                    full_width: true
                    snippet:
                        html: |
                            Use this to copy the permissions from another administrator.
                            
                            All of the target administrator's permissions will be removed and replaced with those of the target administrator's.
                            
                            You cannot use multi-site administrators or trashed administrators, and
                            you cannot copy permissions to yourself.
                
                copy_from:
                    label: 'Copy permissions from:'
                    pick_items:
                        path: zenario__administration/panels/administrators/refiners/active_local////
                        target_path: zenario__administration/panels/administrators
                        min_path: zenario__administration/panels/administrators
                        select_phrase: Select administrator...
                        nothing_selected_phrase: No source admin selected
                    validation:
                        required: Please select an administrator to copy permissions from.
    
    save_button_message: Copy permissions
    cancel_button_message: Cancel
    
    confirm:
        show: true
        message: ''
        message_type: warning
        button_message: Copy permissions
        cancel_button_message: Cancel