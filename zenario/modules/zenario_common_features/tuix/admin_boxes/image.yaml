# You must use a tab-size of 4 spaces to edit this file.
---
zenario_image:
    key:
        id: ''
        filename_on_load: ''
        regular_image: false
        mic_image: false
        special_image: false
        slotName: ''
        instanceId: ''
        eggId: ''
    identifier:
        css_class: media_image
        value: ''
    tabs:
        details:
            edit_mode:
                enabled: true
                priv: _PRIV_MANAGE_MEDIA
            label: Image properties
            fields:
                image:
                    image: {}
                
                filename:
                    label: 'Filename when downloaded:'
                    type: text
                    maxlength: "255"
                
                size:
                    snippet:
                        html: ""
                
                where_used:
                    label: "Where it's used"
                    snippet:
                        html: ""
                
                privacy_public: &privacy
                    hidden: true
                    show_as_a_span: true
                    type: text
                    value: Public
                    note_below: ''
                privacy_private: *privacy
                    value: Private
                    note_below: |
                        This image may only be seen by logged-in extranet users who see it on a password-protected content item.
                        It will not be indexed by search engines.
                privacy_auto: *privacy
                    value: Will auto-detect
                    note_below: |
                        Auto-detect: The first time this image is displayed on a content item, its privacy will be set to 
                        match the privacy of that content item (either "public" or "private").
                        You can set the image's privacy manually using the Actions menu.
                missing_public_image: 
                    hidden: true
                    snippet: 
                        div_class: zenario_fbWarning
                        div: |
                            This image is missing from the directory public/images.
                            Please close this box and click "Repair public links".
                
                alt_tag:
                    label: 'Alt tag:'
                    type: text
                    tooltip: |
                        Zenario sets this automatically when an image is first uploaded. Edit this for SEO.
                        If your site has multiple languages you can override this to translate the tag in the appropriate plugin.

                left_column:
                    type: grouping
                    name: left_column
                tags:
                    grouping: left_column
                    label: 'Organizer tags:'
                    pick_items:
                        path: zenario__content/panels/image_tags
                        multiple_select: true
                        nothing_selected_phrase: No tags yet
                        allow_typing_anything: true
                        select_phrase: Select tags...
                    cols: 4
                    note_below: |
                        Tags are for admin use only. To create a tag, just type the name of a new tag.

                image_credit:
                    label: 'Image credit:'
                    type: text
                    maxlength: "255"
                
                add_a_gallery_caption:
                    label: 'Add a gallery caption'
                    type: checkbox
                    redraw_onchange: true
                    side_note: "If you have an image gallery and want to show this image in the gallery, check here to add a caption."
                floating_box_title:
                    indent: 1
                    label: 'Caption:'
                    type: editor
                    editor_type: description_editor
                    editor_options: 
                        height: 150
                    dont_trim: true
                    side_note: >
                        If image is displayed in an enlarged box, use this caption.
                    visible_if:
                        lib.value: add_a_gallery_caption
                enable_site_setting:
                    hidden: true
                    snippet:
                        html: |
                            <div class="zenario_fbInfo">[[Enable_site_setting_to_use_captions]]</div>

            show_errors_after_field: image
        
        link:
            edit_mode:
                enabled: true
                priv: _PRIV_MANAGE_MEDIA
            label: Link to image
            fields:
                descriptions_grouping:
                    type: grouping
                links_grouping:
                    type: grouping
                    snippet:
                      label: "To embed the image, or link to it, please copy one of the items below."
                
                image_is_public_snippet:
                    grouping: descriptions_grouping
                    snippet:
                        html: |
                            <div class="zenario_fbInfo">This image is public: its URL will not change, and it may be indexed by search engines.</div>
                image_is_not_public_snippet:
                    grouping: descriptions_grouping
                    snippet:
                        html: |
                            <div class="zenario_fbInfo">This image is private: its URL will change on every page load and so is not indexible by search engines.</div>
                
                internal_original_image_link:
                    grouping: links_grouping
                    label: "Internal link to image at full size ([[size]]):"
                    note_below: "To embed the image in a WYSIWYG area, either select the image, or paste this file path into the image tag. Note that the editor will adjust the image tag if you show the image at a different size."
                    type: text
                    readonly: true
                    show_copy_text_button: true
                html_embed_link:
                    grouping: links_grouping
                    label: "Image tag for a Raw HTML/JavaScript Snippet:"
                    note_below: "To embed the image in such a plugin, paste this image tag into the raw HTML."
                    type: text
                    readonly: true
                    show_copy_text_button: true
                external_original_image_link:
                    grouping: links_grouping
                    label: "External link to image at full size:"
                    note_below: "To link to the image from an email or an external website, use this link."
                    type: text
                    readonly: true
                    show_copy_text_button: true
        
        crops_here:
            hide_when_children_are_not_visible: true
        
        crops_elsewhere:
            hide_when_children_are_not_visible: true
        
        crop:
            edit_mode:
                enabled: true
                on: true
                priv: _PRIV_MANAGE_MEDIA
            label: Crop and zoom
            fields:
                description:
                    snippet:
                        p: |
                           You may adjust the crop and zoom positions for this image. To change its aspect ratio and size, please go to the settings for the plugin.
                #This usage column is used for the cropping logic.
                #It is separate to the "Where used" column.
                usage:
                    snippet:
                        html: ''
                
                crop_tool:
                    image: {}
                    image_crop_tool:
                        grid: true
                        full: true
                        preserveAspectRatio: true
                
                aspect_ratio_width:
                    type: hidden
                    hidden: true
                
                aspect_ratio_height:
                    type: hidden
                    hidden: true
    
    confirm:
        show: false
        cancel_button_message: Cancel
        message_type: warning
        message: ''
        button_message: ''
