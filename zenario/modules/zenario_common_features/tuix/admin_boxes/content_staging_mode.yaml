# You must use a tab-size of 4 spaces to edit this file.
---
zenario_content_staging_mode:
    key:
        id: ''
        cID: ''
        cType: ''
        cVersion: ''
    
    identifier:
        css_class: content_draft
        label: Content item ID 
    hide_tab_bar: true
    tabs:
        staging_mode:
            edit_mode:
                enabled: true
                priv: _PRIV_EDIT_DRAFT
            fields:
                desc:
                    snippet:
                        html: |
                            <div style="
                                float: left;
                                display: inline-block;
                                width: 45px;
                                height: 45px;
                                background: url(zenario/admin/images/icon-thumbs-up-shadow.svg) 50% 50%;
                                background-size: 32px 32px;
                                background-repeat: no-repeat;
                                background-color: #ff5600;
                                border-radius: 4px;
                            "></div>
                            <div style="
                                float: left;
                                display: inline-block;
                                margin-left: 10px;
                                margin-top: 4px;
                                margin-bottom: 15px;
                            ">
                                <p>Staging mode allows you to show a draft of a content
                                item with someone who's not a Zenario administrator.</p>
                            </div>
                use_access_code:
                    type: checkbox
                    onoff: true
                    redraw_onchange: true
                access_code:
                    indent: 1
                    hide_if_previous_outdented_value_isnt: 1
                    label: 'Access code:'
                    type: text
                    format_onchange: true
                    style: |
                        width: 4em;
                        font-family: monospace;
                    maxlength: 6
                    validation:
                        required_if_not_hidden: Please enter an access code.
                        no_spaces: The access code may not contain spaces.
                        no_special_characters: The access code may not contain special characters or multilingual characters.
                        ascii_only: The access code may not contain special characters or multilingual characters.
                existing_codes:
                    same_row: true
                    indent: 1
                    hide_if_previous_outdented_value_isnt: 1
                    type: select
                    css_class: iconselectmenu
                    format_onchange: true
                    empty_value: ' -- Use existing code -- '
                    values: {}
                suggest_code:
                    same_row: true
                    indent: 1
                    hide_if_previous_outdented_value_isnt: 1
                    type: button
                    css_class: zenario_gp_button
                    value: Suggest a code
                    format_onchange: true
                    onclick: |
                        lib.markAsChanged();
                    notices_below:
                        code_reuse:
                            hidden: true
                            type: information
                            message: ''
                            html: true
                copy_code_desc:
                    indent: 1
                    hide_if_previous_outdented_value_isnt: 1
                    visible_if:
                        lib.valueIsNotEmpty: copy_code
                    snippet:
                        html: >
                            <p>Note that staging mode only works for content items with permission set to Public, and not Private. In-page links to other unpublished content items will not be shown, even if they are in staging mode.</p>

                            <p>To show this draft to a non-administrator, copy this URL and send it to them:</p>
                copy_code:
                    indent: 1
                    hide_if_previous_outdented_value_isnt: 1
                    hide_if_empty: true
                    type: text
                    readonly: true
                    style: |
                        width: 600px
                    show_copy_text_button: true
                not_saved_warning:
                    indent: 1
                    hide_if_previous_outdented_value_isnt: 1
                    visible_if: |
                        lib.value('access_code') &&
                        lib.value('access_code') != lib.field('access_code').value
                    snippet: {}
                    notices_below:
                        not_saved_warning:
                            hidden: false
                            type: information
                            message: >
                                Don't forget to save this box! The code will start working after saving.
