# You must use a tab-size of 4 spaces to edit this file.
---
zenario_publish:
    priv: _PRIV_PUBLISH_CONTENT_ITEM
    key:
        id: ""
        cID: ""
        cType: ""
    max_height: 450
    hide_tab_bar: true
    save_button_message: Publish
    cancel_button_message: Cancel
    tabs:
        publish:
            edit_mode:
                enabled: true
                enable_revert: false
            
            notices:
                are_you_sure:
                    show: true
                    type: warning
                    message: >
                        Are you sure you wish to publish the selected content item(s)?
                scheduled_warning:
                    show: false
                    type: warning
                    message: ''
            fields:
                access_codes_warning:
                    snippet: {}
                    notices_above:
                        access_codes_warning:
                            hidden: false
                            type: information
                            message: ''
                
                immediately:
                    type: grouping
                    name: immediately
                    grouping_css_class: zenario_vertical_radio
                    grouping_wrapper_css_class: zenario_vertical_radios
                    grouping_onclick: |
                        zenarioAB.clickingGroupingChecksBox('publish_options__immediately');
                publish_options__immediately:
                    grouping: immediately
                    type: radio
                    name: publish_options
                    value: 1
                    label: 'Publish'
                    format_onchange: true
                
                cancel:
                    type: grouping
                    name: cancel
                    grouping_css_class: zenario_vertical_radio
                    grouping_wrapper_css_class: zenario_vertical_radios
                    grouping_onclick: |
                        zenarioAB.clickingGroupingChecksBox('publish_options__cancel');
                publish_options__cancel:
                    grouping: cancel
                    type: radio
                    name: publish_options
                    label: 'Cancel scheduled publishing'
                    format_onchange: true
                
                schedule:
                    type: grouping
                    name: schedule
                    grouping_css_class: zenario_vertical_radio
                    grouping_wrapper_css_class: zenario_vertical_radios
                    grouping_onclick: |
                        zenarioAB.clickingGroupingChecksBox('publish_options__schedule');
                publish_options__schedule:
                    grouping: schedule
                    type: radio
                    name: publish_options
                    label: 'Schedule publishing at...'
                    format_onchange: true
                
                unlisted:
                    type: grouping
                    name: unlisted
                    grouping_css_class: zenario_vertical_radio
                    grouping_wrapper_css_class: zenario_vertical_radios
                    grouping_onclick: |
                        zenarioAB.clickingGroupingChecksBox('publish_options__unlisted');
                publish_options__unlisted:
                    grouping: unlisted
                    type: radio
                    name: publish_options
                    label: 'Publish as an unlisted content item'
                    format_onchange: true
                
                unlisted_note:
                    indent: 1
                    grouping: unlisted
                    visible_if:
                        lib.value: publish_options__unlisted
                    notices_below:
                        unlisted_note:
                            type: information
                            html: true
                            message: |
                                <p>Unlisted content items aren't shown in menus, content summary lists or site maps, and won't appear in searches.</p>
                                <p>They can still be reached by links from Banner plugins, WYSIWYG areas or Raw HTML/JavaScript Snippets.</p>
                    
                publish_date:
                    grouping: schedule
                    visible_if:
                        lib.value: publish_options__schedule
                    label: 'Date & Time'
                    type: date
                    indent: 1
                    no_past_dates: true
                publish_hours:
                    grouping: schedule
                    visible_if:
                        lib.value: publish_options__schedule
                    type: select
                    values:
                        0:
                            label: '00'
                        1:
                            label: '01'
                        2:
                            label: '02'
                        3:
                            label: '03'
                        4:
                            label: '04'
                        5:
                            label: '05'
                        6:
                            label: '06'
                        7:
                            label: '07'
                        8:
                            label: '08'
                        9:
                            label: '09'
                        10:
                            label: '10'
                        11:
                            label: '11'
                        12:
                            label: '12'
                        13:
                            label: '13'
                        14:
                            label: '14'
                        15:
                            label: '15'
                        16:
                            label: '16'
                        17:
                            label: '17'
                        18:
                            label: '18'
                        19:
                            label: '19'
                        20:
                            label: '20'
                        21:
                            label: '21'
                        22:
                            label: '22'
                        23:
                            label: '23'
                    value: 1
                    same_row: true
                publish_mins:
                    grouping: schedule
                    visible_if:
                        lib.value: publish_options__schedule
                    type: select
                    values:
                        00:
                            label: '00'
                        05:
                            label: '05'
                        10:
                            label: '10'
                        15:
                            label: '15'
                        20:
                            label: '20'
                        25:
                            label: '25'
                        30:
                            label: '30'
                        35:
                            label: '35'
                        40:
                            label: '40'
                        45:
                            label: '45'
                        50:
                            label: '50'
                        55:
                            label: '55'
                        
                    value: 00
                    same_row: true
                publishing_before_release_date_warning:
                    snippet:
                        html: |
                            <div class="zenario_fbWarning">
                                [[publishing_before_release_date_warning_note]]
                            </div>
