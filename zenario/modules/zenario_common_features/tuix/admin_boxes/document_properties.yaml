# You must use a tab-size of 4 spaces to edit this file.
---
zenario_document_properties:
    key: 
        id: ''
        delete_thumbnail: ''
    identifier: 
        css_class: zenario_file_item
        value: ''
    tabs:
        details:
            label: Document metadata
            edit_mode:
                on: Yes
                enabled: Yes
            fields:
                document_extension:
                    label: 'Extension:'
                    type: text
                    maxlength: 255
                    hidden: true
                    readonly: true
                    hide_in_dataset_editor: true
                    
                document_title:
                    label: 'Title:'
                    type: text
                    maxlength: "255"
                    tooltip: |
                        This can be shown to the visitor when the document is shown in a Document Container plugin.
                document_name:
                    label: 'Filename:'
                    type: text
                    maxlength: "255"
                checksum:
                    label: 'Checksum:'
                    type: text
                    maxlength: 5
                    hidden: true
                    readonly: true
                date_uploaded:
                    label: 'Date uploaded:'
                    type: datetime
                    readonly: Yes
                privacy:
                    label: 'Privacy'
                    type: radios
                    values:
                        public:
                            label: 'Public'
                        private:
                            label: 'Private'
                        offline:
                            label: 'Offline'
                    validation:
                        required: 'Choose the privacy of the document.'
                chain_documents:
                    type: grouping
                    name: chain_documents
                    dataset_label: '[Chain grouping]'
                add_to_chain:
                    grouping: chain_documents
                    visible_if:
                        lib.valueIsEmpty: chain_ids
                    type: checkbox
                    label: 'Link to another document'
                    redraw_onchange: true
                chain_id:
                    grouping: chain_documents
                    dataset_label: '[Document link picker]'
                    indent: 1
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: 1
                    pick_items:
                        #path: zenario__library/panels/documents/refiners/public_documents_only////
                        path: zenario__library/panels/documents
                        min_path: zenario__library/panels/documents
                        max_path: zenario__library/panels/documents
                        target_path: zenario__library/panels/documents
                        disallow_refiners_looping_on_min_path: true
                        select_phrase: Select a document to link to...
                        disabled_if_for_all_selected_items: |
                            item.type == 'folder'
                    validation:
                        required_if_not_hidden: true
                in_chain:
                    grouping: chain_documents
                    dataset_label: '["Remove document link" checkbox]'
                    visible_if:
                        lib.valueIsNotEmpty: chain_ids
                    type: checkbox
                    #label: ''
                    redraw_onchange: true
                    tooltip: |
                        Uncheck this checkbox to remove the link.
                chain_ids:
                    grouping: chain_documents
                    dataset_label: '[Document link viewer]'
                    indent: 1
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: 1
                    pick_items:
                        path: zenario__library/panels/documents
                        multiple_select: true
                    readonly: true
                tags:
                    label: 'Document tags:'
                    type: checkboxes
                    load_values_from_organizer_path: zenario__library/panels/document_tags
                link_to_add_tags:
                    full_width: true
                    snippet:
                        html: ""
                    dataset_label: '[Link to add document tags]'
        upload_image:
            label: Thumbnail image
            edit_mode:
                enabled: Yes
            fields:
                thumbnail_grouping:
                    name: thumbnail_grouping
                    type: grouping
                title:
                    grouping: thumbnail_grouping
                    label: 'Current thumbnail image (public):'
                thumbnail_image:
                    grouping: thumbnail_grouping
                    dataset_label: '[Thumbnail image]'
                    full_width: true
            
                delete_thumbnail_image:
                    grouping: thumbnail_grouping
                    dataset_label: '[Delete thumbnail image button]'
                    value: Delete
                    type: submit
                    class: zenario_gp_button
            
                zenario_common_feature__upload:
                    grouping: thumbnail_grouping
                    label: 'Upload new thumbnail image (public):'
                    upload:
                        multi: false
                        drag_and_drop: true
                        accept: 'image/png, image/jpeg, image/gif, image/webp'
                        extensions:
                            - .gif
                            - .jpg
                            - .jpeg
                            - .png
                            - .webp
        extract:
            label: Extract
            edit_mode:
                on: false
            fields:
                extract:
                    label: 'Extract text:'
                    type: textarea
                    tall_as_possible: true
                    cols: 30
                    style: >
                        width: 60em;
                extract_wordcount:
                    label: 'Extract wordcount:'
                    type: text
                    align_right: true
                    style: >
                        width: 13em;