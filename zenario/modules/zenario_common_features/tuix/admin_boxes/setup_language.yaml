# You must use a tab-size of 4 spaces to edit this file.
---
zenario_setup_language:
    title: ""
    key:
        id: ""
    identifier:
        css_class: language
        label: Language code
    tabs:
        settings:
            label: Settings
            edit_mode:
                priv: _PRIV_MANAGE_LANGUAGE_CONFIG
                enabled: Yes
            fields:
                default_language_info_snippet:
                    snippet:
                        html: |
                            <div class="zenario_fbInfo">
                                Default language for this site
                            </div>
                            
                            <p><strong>[[language_english_name]]</strong> [[is_or_will_be]] enabled. Content items in this language will include its ISO code, "[[iso_code]]" in the page head.</p>

                            <p>When a Zenario site has more than one language, a <strong>translation chain</strong> is used to group content items together. Items in a translation chain are assumed to have the same meaning, while being in different languages.</p>
                          
                            <p>The items of a translation chain are in the same position in the menu hierarchy, and on an extranet site they have the same user permissions.</p>

                            <p>To make a translation, an administrator should use the "Translations" tab on the admin toolbar to create a translation of a content item from the original. The new item's content can be translated with machine translation assistance, or by a human.</p>

                            <p>Beside content items, there are phrases, which come from plugins, and they can also be translated. Phrases can be found under the <strong>International</strong> section of Organizer.</p>

                    visible_if: |
                        zenarioAB.tuix.key.id && (!zenarioA.siteSettings.default_language || zenarioAB.tuix.key.id == zenarioA.siteSettings.default_language)
                secondary_language_info_snippet:
                    snippet:
                        html: |
                            <div class="zenario_fbInfo">
                               This is a non-default, or secondary, language.
                            </div>
                             
                            <p><strong>[[language_english_name]]</strong> [[is_or_will_be]] enabled. Content items in this language will include its ISO code, "[[iso_code]]" in the page head.</p>

                            <p>When a Zenario site has more than one language, a <strong>translation chain</strong> is used to group content items together. Items in a translation chain are assumed to have the same meaning, while being in different languages.</p>
                          
                            <p>The items of a translation chain are in the same position in the menu hierarchy, and on an extranet site they have the same user permissions.</p>

                            <p>To make a translation, an administrator should use the "Translations" tab on the admin toolbar to create a translation of a content item from the original. The new item's content can be translated with machine translation assistance, or by a human.</p>

                            <p>Beside content items, there are phrases, which come from plugins, and they can also be translated. Phrases can be found under the <strong>International</strong> section of Organizer.</p>
                    visible_if: |
                        zenarioAB.tuix.key.id && (zenarioA.siteSettings.default_language && zenarioAB.tuix.key.id != zenarioA.siteSettings.default_language)
                english_name:
                    label: 'Language name (in English):'
                    type: text
                    maxlength: 100
                    validation:
                        required: Please enter the name of this language. This should be written in English as the Zenario administrator interface is in English.
                    side_note: >
                        Please enter the name of the language. This should be in English, as the Zenario administrator interface is in English.
                language_local_name:
                    label: 'Language name in its own language:'
                    type: text
                    maxlength: 100
                    validation:
                        required: Please enter the name of this language in its own language.
                    side_note: >
                        The name of the language, in its own language. This name will be displayed to visitors who see the site in that language.
                
                translate_phrases:
                    type: checkbox
                    readonly: true
                    label: 'Use phrases system'
                    show_phrase_icon: true
                uses_phrases:
                    same_row: true
                    note_below: |
                        Phrases are chunks of text, defined in plugin settings, Twig frameworks, and PHP program files.
                        Their definition is in English, but translations of these phrases can be made in other languages.
                        When Zenario displays a phrase, it displays the translation in the visitor's language if it exists.
                doesnt_use_phrases:
                    same_row: true
                    note_below: |
                        Phrases are chunks of text, defined in plugin settings, Twig frameworks, and PHP program files.
                        Their definition is in English, but translations of these phrases can be made in other languages.
                        When Zenario displays a phrase, it displays the translation in the visitor's language if it exists.
                flag_filename:
                    label: 'Flag CSS class name:'
                    type: text
                    maxlength: 5
                    style: >
                        width: 6em;
                    pre_field_html: >
                        lang_
                    side_note: |
                        Any language picker plugins will use this CSS class name when they try to show a flag.
                    validation:
                        required: Please enter a class name.
                
                detect:
                    type: checkbox
                    onoff: true
                    value: true
                    label: |
                        Use browser language detection
                    redraw_onchange: Yes
                    note_below: |
                        Recommended. Zenario will detect the language of the visitor's browser, and redirect them to the requested content item in that language,
                        if it exists. If it doesn't exist, it will fall back on the default language of the site.
                detect_lang_codes:
                    type: text
                    maxlength: 100
                    label: 'Detected language codes:'
                    side_note: |
                        When a visitor accesses the site without a specific page set in their URL,
                        they will be directed to the home page of this language if their requested
                        language matches one of the language codes listed here (comparison is case-insensitive).
                        Enter one or more language codes, separate multiple codes with a comma.
                    visible_if: "zenarioAB.value('detect')"
                    indent: 1
                    note_below: |
                        The visitor's browser's language code must match or start with the code(s) entered here.
                        Multiple language codes may be entered (separated by commas). For example, for Portuguese, the value may be: <code>pt-eu,pt-br,pt</code>.
                
                language_picker_logic:
                    label: Visibility in language pickers
                    type: select
                    value: visible_or_disabled
                    values:
                        visible_or_disabled:
                            label: Always show. If no link is possible then show as a disabled link.
                        visible_or_hidden:
                            label: Only show if a link is possible, hide if one is not.
                        always_hidden:
                            label: Never show, even if a link is possible.
                
                search_type:
                    label: 'Search algorithm:'
                    type: radios
                    value: full_text
                    values:
                        full_text:
                            label: Use MySQL full-text search
                            side_note: Use individual words to search, e.g. a search for "van" will not match "caravan". We suggest this for most Western languages.
                        simple:
                            label: Use "LIKE" in searches
                            side_note: Search for anything containing the search term, e.g. a search for "van" would match "caravan". We suggest this for languages that use symbols such as Japanese and Chinese.
                dec_point:
                    label: 'When displaying numbers, decimal separator:'
                    type: text
                    note_below: Usually a period (.) or comma (,).
                    maxlength: 5
                    style: |
                        width: 2em;
                thousands_sep:
                    label: 'When displaying numbers, thousands separator:'
                    type: text
                    note_below: Usually a comma (,) a period (.) or a space.
                    maxlength: 5
                    style: |
                        width: 2em;
                use_domain:
                    visible_if: |
                        zenarioA.multipleLanguagesEnabled()
                        && zenarioA.siteSettings.primary_domain
                    label: 'Use a language-specific domain'
                    type: checkbox
                    redraw_onchange: true
                domain:
                    visible_if: |
                        zenarioA.multipleLanguagesEnabled()
                        && zenarioA.siteSettings.primary_domain
                        && zenarioAB.value('use_domain')
                    indent: 1
                    label: 'Domain:'
                    type: text
                    side_note: |
                        Links to content items in this language will use this domain in the URL.
                primary_domain_warning:
                    visible_if: |
                        zenarioA.multipleLanguagesEnabled()
                        && !zenarioA.siteSettings.primary_domain
                    label: 'Use a language-specific domain'
                    type: checkbox
                    readonly: true
                    side_note: |
                        If enabled, pages in this language will be available via a different domain or subdomain from the rest of the site.
                        You need to set a primary domain before you can use a language-specific domain.
                        Please go to <em>Configuration -&gt; Site settings -&gt; Domains</em>
                        and set the primary domain.
                
                show_untranslated_content_items:
                    visible_if: |
                        zenarioAB.tuix.key.id != zenarioA.siteSettings.default_language
                    label: ''
                    type: radios
                    values:
                        0:
                            ord: 2
                            label: ''
                        1:
                            ord: 1
                            label: ''
