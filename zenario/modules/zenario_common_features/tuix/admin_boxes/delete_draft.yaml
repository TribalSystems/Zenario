# You must use a tab-size of 4 spaces to edit this file.
---
zenario_delete_draft:
    priv: _PRIV_EDIT_DRAFT
    key:
        id: ""
        cID: ""
        cType: ""
    tabs:
        delete_draft:
            edit_mode:
                enabled: true
                enable_revert: false
            
            notices:
                delete_item:
                    type: warning
                    message: ||
                        Delete this content item's draft version?

                        If the content item is already published, that version will not be affected.
                delete_items:
                    type: warning
                    message: |
                        Delete the selected content items' draft versions?

                        Where a content item is already published, that version will not be affected.
            fields:
                access_codes_warning:
                    snippet: {}
                    notices_above:
                        access_codes_warning:
                            hidden: false
                            type: information
                            message: ''
                links_warning:
                    snippet:
                        html: ''
                    hidden: true
                delete_options:
                    type: radios
                    values:
                        remove:
                            label: 'Keep the plugin(s) but remove their links'
                        delete_instance:
                            label: 'Delete the plugin(s) altogether'
                    value: remove
                    hidden: true
                translations_warning:
                    pre_field_html: |
                        <b>Translations</b><br />
                    snippet:
                        html:
                    hidden: true
                th_content_item:
                    <table class="zfab_grey_table"><tr><th>:
                    snippet:
                        label: Content item
                    hidden: true
                    </th>:
                th_translation:
                    <th>:
                    snippet:
                        label: Translation
                    hidden: true
                    </th>:
                th_status:
                    <th>:
                    snippet:
                        label: Status
                    hidden: true
                    </th>:
                th_action:
                    <th>:
                    snippet:
                        label: Action
                    hidden: true
                    </th></tr>
                table_end:
                    ord: 999999
                    hidden: true
                    </table>:
            custom_template_fields:
                content_item__znz:
                    <tr><td>:
                    type: text
                    show_as_a_span: true
                    readonly: true
                    </td>:
                translation__znz:
                    <td>:
                    type: text
                    show_as_a_span: true
                    readonly: true
                    </td>:
                status__znz:
                    <td>:
                    type: text
                    show_as_a_span: true
                    readonly: true
                    </td>:
                action__znz:    
                    <td>:
                    type: select
                    empty_value: ' -- Please choose what to do with this translation -- '
                    values:
                        keep:
                            label: Keep translation
                        delete:
                            label: Delete translation
                    validate_onchange: true
                    validation:
                        only_validate_when_saving: true
                        required: true
                    </td></tr>:
    
    max_height: 160
    hide_tab_bar: true
    save_button_message: Delete
    cancel_button_message: Cancel
