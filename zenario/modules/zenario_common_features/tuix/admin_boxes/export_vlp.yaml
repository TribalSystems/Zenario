# You must use a tab-size of 4 spaces to edit this file.
---
zenario_export_vlp:
    priv: _PRIV_MANAGE_LANGUAGE_PHRASE
    title: Exporting phrases
    key:
        id: ""
        export_code_based_phrases_only: false
        export_standard_phrases_only: false
    max_height: "300"
    hide_tab_bar: true
    tabs:
        export:
            edit_mode:
                enabled: true
            fields:
                desc:
                    full_width: true
                    snippet:
                        html: ""
                    notices_below:
                        phrases_coming_from_missing_or_uninitialised_modules:
                            hidden: true
                            type: warning
                            message: ''
                        export_code_based_phrases_only:
                            hidden: true
                            type: information
                            message: 'Exporting code-based phrases only.'
                        export_standard_phrases_only:
                            hidden: true
                            type: information
                            message: 'Exporting standard phrases only.'
                option:
                    label: 'Include:'
                    type: select
                    values:
                        present: ""
                        missing: ""
                        all: ""
                    value: all
                format:
                    label: 'Format:'
                    type: select
                    values:
                        xlsx:
                            ord: 1
                            label: xlsx (Excel 2007 and later) (Recommended)
                        xls:
                            ord: 2
                            label: xls (Excel 5)
                        csv:
                            ord: 3
                            label: csv (comma-separated values)
                    value: xlsx
    download: true
    save_button_message: Export
    cancel_button_message: Cancel