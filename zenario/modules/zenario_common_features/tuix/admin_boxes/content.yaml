# You must use a tab-size of 4 spaces to edit this file.
---
zenario_content:
    key:
        openNextMode: ''
        id: ''
        cID: ''
        cType: ''
        cVersion: ''
        is_special_page: false
        special_page_type: ''
        
        source_cID: ''
        source_cVersion: ''
        
        create_from_content_panel: ''
        create_from_toolbar: ''
        from_cID: ''
        from_cType: ''
        from_mID: 0
        
        translate: ''
        equivId: ''
        id_is_menu_node_id: ''
        id_is_parent_menu_node_id: ''
        duplicate: ''
        duplicate_from_menu: ''
        
        target_cType: ''
        target_title: ''
        target_alias: ''
        target_language_id: ''
        target_template_id: ''
        target_menu: ''
        target_menu_parent: ''
        target_menu_section: ''
        target_menu_title: ''

        edit_linked_content_item: ''
        
        last_title: ''
        
        local_file_id_on_load: 0
        menu_text_on_load: ''
        
        groups_exist: true
    
    identifier:
        css_class: content_draft
        label: Content item ID 
    title: Creating a content item
    
    css_class: 'zenario_fab_default_style zenario_fab_2_cols'
    
    tabs:
        meta_data:
            ord: 10
            label: Metadata
            edit_mode:
                enabled: false
                priv: _PRIV_EDIT_DRAFT
            notices:
                locked_warning:
                    show: false
                    type: warning
                    message: ''
                scheduled_warning:
                    show: false
                    type: warning
                    message: ''
            fields:
                special_page_message:
                    hidden: true 
                    pre_field_html: "<div class=\"zenario_fbInfo\">"
                    snippet: 
                        html: ""
                    post_field_html: "</div>"
                    
                grouping_title_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                title_original:
                    grouping: grouping_title_left
                    type: text
                    label: 'Browser title (original):'
                    show_as_a_span: true
                
                grouping_title_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                title:
                    grouping: grouping_title_right
                    ord: 20
                    label: 'Browser title:'
                    type: text
                    #The maxlength parameter is set in the PHP class.
                    show_plain_note_below: true
                    progress_bar: true
                    oninput: |
                        zenarioAB.contentTitleChange();
                        cnt = $(lib.get('title')).val().length;
                        if (cnt < 1) {
                            seo_message_title = 'Please enter a title for this content item.';
                        } else if (cnt < 12) {
                            seo_message_title = 'For good SEO and on-site search, make the title longer.';
                        } else if (cnt < 26) {
                            seo_message_title = 'For good SEO and on-site search, make the title a little longer.';
                        } else if (cnt < 70) {
                            seo_message_title = 'This is a good title length.';
                        } else {
                            seo_message_title = 'The title may not be fully visible in search engine results.';
                        }

                        $('#' + lib.idPrefix() + 'row__title .zenario_note_below_plain .zenario_note_content').text(seo_message_title);
                        
                    redraw_microtemplates_onkeyup: true
                    notices_below:
                        title_is_longer_than_the_allowed_length:
                            hidden: true
                            type: warning
                            size: small
                            message: "Warning: the content item's title is longer than the allowed length. It will be shortened on saving."
                auto_populate_title_from_filename:
                    grouping: grouping_title_right
                    ord: 20.1
                    label: "Auto-populate from file name"
                    type: checkbox
                    format_onchange: true
                
                grouping_language_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                language_id_original:
                    grouping: grouping_language_left
                    label: 'Language (original):'
                    type: select
                    show_as_a_span: true
                
                grouping_language_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                language_id:
                    grouping: grouping_language_right
                    ord: 30
                    label: 'Language:'
                    type: select
                    show_as_a_span: false
                language_id_on_load:
                    grouping: grouping_language_right
                    hidden: true
                    type: text
                
                content_item_translation_info:
                    grouping: grouping_language_right
                    ord: 31
                    snippet:
                        html: ''
                    hidden: true
                
                grouping_release_date_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                release_date_original:
                    grouping: grouping_release_date_left
                    type: date
                    label: 'Release date (original):'
                    show_as_a_span: true
                
                grouping_release_date_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                release_date:
                    grouping: grouping_release_date_right
                    ord: 32
                    label: 'Release date:'
                    type: date
                    change_month_and_year: true
                    allow_typing_in_date_field: true
                    show_date_format_as_placeholder: true
                    tooltip: |
                        The official, or publicly-displayed date, of this content item; it may differ from the date when actually published.
                
                grouping_menu_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                    ord: 32
                
                menu_original:
                    grouping: grouping_menu_left
                    label: 'Menu (original):'
                    type: text
                    show_as_a_span: true
                    css_class: zenario_textbox_noborder zfab_menuPathPreviewNode zfab_menuPathPreviewUpdatingNode
                
                grouping_menu_right:
                    ord: 33
                    type: grouping
                    name: menu
                    grouping_css_class: duplicating_right_column
                create_menu_node:
                    grouping: grouping_menu_right
                    type: checkbox
                    label: Add to menu navigation
                    value: 1
                    format_onchange: true
                no_menu_warning:
                    grouping: grouping_menu_right
                    indent: 1
                    hide_if_previous_outdented_value_isnt: ''
                    snippet:
                        div_class: zenario_fbWarning
                        div: 'Warning: if not added to menu navigation, this page might be hard for users to find.'
                menu_pos_locked_warning:
                    grouping: grouping_menu_right
                    indent: 1
                    hidden: true
                    hide_if_previous_outdented_value_isnt: 1
                    snippet:
                        div_class: zenario_fbWarning
                        div: 'A preferential menu node exists for this content type. The initial menu position for content items of this type has been locked.'
                menu_pos:
                    grouping: grouping_menu_right
                    indent: 1
                    hide_if_previous_outdented_value_isnt: 1
                    type: select
                    values:
                        suggested:
                            label: |
                                Suggested position in the menu
                        before:
                            label: |
                                Just before current item in the menu
                        after:
                            label: |
                                Just after current item in the menu
                        under:
                            label: |
                                Below current item in the menu
                        specific:
                            label: |
                                Choose position in the menu...
                    format_onchange: true
                menu_pos_suggested:
                    grouping: grouping_menu_right
                    indent: 2
                    visible_if: |
                        lib.value('create_menu_node')
                    hide_if_previous_outdented_value_isnt: suggested
                    type: select
                    values: {}
                    format_onchange: true
                menu_pos_before:
                    grouping: grouping_menu_right
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: before
                    readonly: true
                    pick_items: &pick_menu_pos
                        path: zenario__menu/panels/menu_position/refiners/create////
                        min_path: zenario__menu/panels/menu_position
                        disallow_refiners_looping_on_min_path: true
                        select_phrase: Place menu node...
                        hide_info_button: true
                        visible_if_for_all_selected_items: |
                            zenario.engToBoolean(item.menu_id) || zenario.engToBoolean(item.is_dummy_child)
                menu_pos_after:
                    grouping: grouping_menu_right
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: after
                    readonly: true
                    pick_items: *pick_menu_pos
                menu_pos_under:
                    grouping: grouping_menu_right
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: under
                    readonly: true
                    pick_items: *pick_menu_pos
                menu_pos_specific:
                    grouping: grouping_menu_right
                    indent: 2
                    hide_with_previous_outdented_field: true
                    hide_if_previous_outdented_value_isnt: specific
                    pick_items: *pick_menu_pos
                    validation:
                        required_if_not_hidden: Please select where this item should appear in the menu.
                    format_onchange: true
                menu_content_status:
                    grouping: grouping_menu_right
                    type: hidden
                    same_row: true        
                menu_text:
                    grouping: grouping_menu_right
                    indent: 1
                    hide_if_previous_outdented_value_isnt: 1
                    label: 'Menu navigation text:'
                    type: text
                    maxlength: 125
                    onchange: zenarioAB.tuix._cms_menuTextChanged = true;
                    validation:
                        required_if_not_hidden: Please enter some text for menu navigation.
                    tooltip: |
                        Brief text in the menu navigation linking to this content item. We suggest the same as browser title, or shorter.
                    oninput: |
                        $(zenarioAB.get('span__menu_path_preview')).text(this.value);
                menu_id_when_editing:
                    grouping: grouping_menu_right
                    type: hidden
                    hidden: true
                menu_text_when_editing:
                    #This field is the same as the "Menu node text" one, but only visible when editing an item.
                    grouping: grouping_menu_right
                    label: 'Menu node text:'
                    type: text
                    maxlength: 125
                    onchange: zenarioAB.tuix._cms_menuTextChanged = true;
                    validation:
                        required_if_not_hidden: Please enter some text for the menu node.
                    oninput: |
                        
                        var $warningRow = $(lib.get('row__redraft_menu_warning')),
                            $warningEl = $(lib.get('redraft_menu_warning'));
                        
                        if (lib.value('menu_text_when_editing') != this.value
                         && lib.valueIn('menu_content_status', 'draft', 'hidden_with_draft', 'published_with_draft')) {
                            $warningRow.removeClass('zfab_inline_warning_hidden');
                            $warningEl.text('Warning: The change to the menu node text will go live immediately, but you will need to publish the content item so that its changes go live.');
                        
                        } else
                        if (lib.value('menu_text_when_editing') != this.value
                         && lib.value('menu_content_status') == 'published') {
                            $warningRow.removeClass('zfab_inline_warning_hidden');
                            $warningEl.text('Warning: The change to the menu node text will go live immediately. For the content item, a new version will be created and you should publish this so that any other changes go live.');
                        
                        } else {
                            $warningRow.addClass('zfab_inline_warning_hidden');
                            $warningEl.text('');
                        }
                        
                        $(zenarioAB.get('span__menu_path_preview')).text(this.value);
                menu_text_when_editing_on_load:
                    grouping: grouping_menu_right
                    type: hidden
                    hidden: true
                redraft_menu_warning:
                    row_class: zfab_inline_warning_hidden
                    grouping: grouping_menu_right
                    indent: 1
                    snippet:
                        html: |
                            <div id="zaf_redraft_menu_warning" class="zenario_fbWarning"></div>
                
                menu_path_preview:
                    grouping: grouping_menu_right
                    ord: 1003
                    label: 'Menu path preview:'
                    type: text
                    show_as_a_span: true
                    css_class: zenario_textbox_noborder zfab_menuPathPreviewNode zfab_menuPathPreviewUpdatingNode
                
                menu_text_already_exists_warning:
                    grouping: grouping_menu_right
                    ord: 1004
                    hidden: true
                    snippet:
                        html: |
                            <div class="zenario_fbWarning">The menu node text already exists in [[language]].</div>
                
                content_item_is_public:
                    type: hidden
                    hidden: true
                
                grouping_alias_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                    ord: 34
                
                alias_original:
                    grouping: grouping_alias_left
                    type: text
                    label: 'Alias (original):'
                    show_as_a_span: true
                
                grouping_alias_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                    ord: 35
                alias:
                    grouping: grouping_alias_right
                    label: 'Alias:'
                    type: text
                    #PLEASE NOTE: if you need to change the maxlength parameter,
                    #please also update the function zenarioAB.generateAlias()
                    #to trim the auto-generated alias to the new maxlength.
                    maxlength: 75
                    note_below: 'alias'
                    show_plain_note_below: true
                    progress_bar: true
                    read_only: false
                    oninput: |
                        $(lib.get('suggest_alias_from_title')).show();

                        cnt = $(lib.get('alias')).val().length;
                        if (lib.value('content_item_is_public')) {
                            if (cnt < 1) {
                                seo_message_title = 'For good SEO, set up an alias for this content item.';
                            } else {
                                seo_message_title = 'This content item has an alias.';
                            }
                        } else {
                            if (cnt < 1) {
                                seo_message_title = 'This content item does not have an alias. It is good practice to set one, even if the content item is not public.';
                            } else {
                                seo_message_title = 'This content item has an alias.';
                            }
                        }

                        $('#' + lib.idPrefix() + 'row__alias .zenario_note_below_plain .zenario_note_content').text(seo_message_title);
                    onchange: |
                        zenarioAB.tuix._cms_aliasChanged = true;
                        $(lib.get('alias_changed')).val(1);
                    redraw_microtemplates_onkeyup: true
                suggest_alias_from_title:
                    grouping: grouping_alias_right
                    type: button
                    css_class: zfab_text_link_button
                    same_row: true
                    value: 'Suggest alias from title'
                    style: display:none
                    onclick: |
                        $(lib.get('alias_changed')).val("");
                        zenarioAB.tuix._cms_aliasChanged = false; 
                        zenarioAB.contentTitleChange(); 
                        $(lib.get('suggest_alias_from_title')).hide();
                alias_warning_display_wrapper:
                    grouping: grouping_alias_right
                    row_class: zfab_inline_warning_hidden
                    snippet:
                        html: |
                            <div id="alias_warning_display"></div>
                url_format:
                    grouping: grouping_alias_right
                    type: text
                    hidden: true
                alias_changed:
                    grouping: grouping_alias_right
                    type: hidden
                    same_row: true
                    hide_if_empty: true
                
                grouping_description_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                description_original:
                    grouping: grouping_description_left
                    type: textarea
                    style: height:45px
                    label: 'Description meta tag (original):'
                    show_as_a_span: true
                
                grouping_description_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                description:
                    grouping: grouping_description_right
                    label: 'Description meta tag:'
                    type: textarea
                    style: height:45px
                    note_below: 'description'
                    show_plain_note_below: true
                    progress_bar: true
                    oninput: |
                        cnt = $(lib.get('description')).val().length;
                        if (cnt < 1) {
                            seo_message_description = 'For good SEO, enter a description. It may be visible in search engine result listings. If left blank, search engines will auto-generate one, which may not be as well-worded.';
                        } else if (cnt < 50) {
                            seo_message_description = 'For good SEO, make the description longer to entice people to click through from a result list.';
                        } else if (cnt < 100) {
                            seo_message_description = 'For good SEO, make the description a little longer to entice people to click through from a result list.';
                        } else if (cnt < 156) {
                            seo_message_description = 'This is a good description length for SEO.';
                        } else {
                            seo_message_description = 'The description is a little long for good SEO as it may not be fully visible.';
                        }

                        $('#' + lib.idPrefix() + 'row__description .zenario_note_below_plain .zenario_note_content').text(seo_message_description);
                    
                    redraw_microtemplates_onkeyup: true
                
                grouping_sitemap_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                sitemap_original:
                    grouping: grouping_sitemap_left
                    type: text
                    label: 'XML sitemap (original):'
                    show_as_a_span: true
                
                grouping_sitemap_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                sitemap:
                    grouping: grouping_sitemap_right
                    label: 'XML sitemap:'
                sitemap_disabled:
                    grouping: grouping_sitemap_right
                    same_row: true
                    visible_if: |
                        !zenarioA.siteSettings.sitemap_enabled
                    type: text
                    value: Not enabled for this site.
                    readonly: true
                    show_as_a_span_when_readonly: true
                    
                    enable_microtemplates_in_properties: true
                    post_field_html: |
                        <% link = 'organizer.php#zenario__administration/panels/site_settings//search_engine_optimisation~.site_settings~tsitemap_robots~k{"id"%3A"search_engine_optimisation"}'; %>
                        <a
                            target="_blank"
                            href="{{URLBasePath|e}}{{link|e}}"
                        >View XML sitemap settings</a>
                excluded_from_sitemap:
                    grouping: grouping_sitemap_right
                    same_row: true
                    visible_if: |
                        zenarioA.siteSettings.sitemap_enabled
                    type: text
                    value: Automatically excluded
                    readonly: true
                    show_as_a_span_when_readonly: true
                included_in_sitemap:
                    grouping: grouping_sitemap_right
                    same_row: true
                    visible_if: |
                        zenarioA.siteSettings.sitemap_enabled
                    type: text
                    value: Automatically included
                    readonly: true
                    show_as_a_span_when_readonly: true
                exclude_from_sitemap:
                    grouping: grouping_sitemap_right
                    same_row: true
                    hide_with_previous_field: true
                    type: checkbox
                    pre_field_html: '('
                    label: Exclude
                    post_field_html: ')'
                    redraw_onchange: true
                search_engine_preview:
                    grouping: grouping_sitemap_right
                    indent: 1
                    hide_with_previous_field: true
                    visible_if: |
                        !zenarioAB.value('exclude_from_sitemap')
                    label: 'Search engine results preview:'
                    snippet:
                        microtemplate: zenario_admin_box_search_engine_preview
                apply_noindex_meta_tag:
                    grouping: grouping_sitemap_right
                    indent: 1
                    type: checkbox
                    label: Apply a noindex meta tag
                    visible_if: |
                        (zenarioA.siteSettings.sitemap_enabled && lib.value('exclude_from_sitemap'))
                
                grouping_keywords_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                keywords_original:
                    grouping: grouping_keywords_left
                    type: textarea
                    label: 'Keywords meta tag (original):'
                    show_as_a_span: true
                
                grouping_keywords_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                keywords:
                    grouping: grouping_keywords_right
                    label: 'Keywords meta tag:'
                    type: textarea
                    style: height:30px
                    oninput: "$(lib.get('snippet__keywords_counter')).html($(lib.get('keywords')).val().length);"
                    post_field_html: |
                        <div class="snippet__keywords" >
                            <div id="zaf_snippet__keywords_length">
                                <span id="zaf_snippet__keywords_counter">[[initial_characters_count]]</span>
                            </div>
                        </div>
                
                grouping_writer_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                
                writer_id_original:
                    grouping: grouping_writer_left
                    label: 'Writer (original):'
                    pick_items:
                        path: zenario__content/panels/writer_profiles
                        target_path: zenario__content/panels/writer_profiles
                        min_path: zenario__content/panels/writer_profiles
                        select_phrase: Select a writer...
                        nothing_selected_phrase: Nobody selected
                    show_as_a_span: true
                
                grouping_writer_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                
                writer_id:
                    grouping: grouping_writer_right
                    label: 'Writer:'
                    pick_items:
                        path: zenario__content/panels/writer_profiles
                        target_path: zenario__content/panels/writer_profiles
                        min_path: zenario__content/panels/writer_profiles
                        select_phrase: Select a writer...
                        nothing_selected_phrase: Nobody selected
                    format_onchange: true
                
                
                grouping_pinned_left:
                    type: grouping
                    grouping_css_class: duplicating_left_column
                    start_new_grouping_wrapper: true
                    grouping_wrapper_css_class: row_of_groupings
                    ord: 129
                
                pinned_original:
                    grouping: grouping_pinned_left
                    type: checkbox
                    onoff: true
                    label: 'Pinned (original)'
                    show_as_a_span: true
                
                pinned_original_more_info:
                    indent: 1
                    grouping: grouping_pinned_left
                    type: text
                    show_as_a_span: true
                    visible_if: lib.value('pinned_original')
                
                grouping_pinned_right:
                    type: grouping
                    grouping_css_class: duplicating_right_column
                    ord: 130
                pinned:
                    label: 'Pin'
                    grouping: grouping_pinned_right
                    type: checkbox
                    onoff: true
                    tooltip: 'Pinned items appear first on content summary lists.'
                    redraw_onchange: true
                pinned_duration:
                    indent: 1
                    grouping: grouping_pinned_right
                    type: radios
                    value: until_unpinned
                    values:
                        fixed_date:
                            ord: 1
                            label: 'Pin until...'
                            split_values_if_selected: true
                        fixed_duration:
                            ord: 2
                            label: 'Pin for...'
                            split_values_if_selected: true
                        until_unpinned:
                            ord: 3
                            label: 'Pin indefinitely'
                    redraw_onchange: true
                    visible_if: lib.value('pinned')
                    validation:
                        required_if_not_hidden: 'Please select the duration.'
                unpin_date:
                    grouping: grouping_pinned_right
                    indent: 2
                    label: 'Unpin date:'
                    type: date
                    change_month_and_year: true
                    visible_if: lib.value('pinned') && lib.value('pinned_duration') == 'fixed_date'
                pinned_fixed_duration_value:
                    grouping: grouping_pinned_right
                    indent: 2
                    type: text
                    value: 1
                    maxlength: 2
                    style: 'width: 3em;'
                    format_onchange: true
                    validation:
                        numeric: 'Please enter a number.'
                    visible_if: lib.value('pinned') && lib.value('pinned_duration') == 'fixed_duration'
                pinned_fixed_duration_unit:
                    grouping: grouping_pinned_right
                    same_row: true
                    type: select
                    value: days
                    values:
                        days:
                            ord: 1
                            label: 'Days'
                        weeks:
                            ord: 2
                            label: 'Weeks'
                    visible_if: lib.value('pinned') && lib.value('pinned_duration') == 'fixed_duration'
                pinned_duration_part_2:
                    grouping: grouping_pinned_right
                    indent: 1
                    snippet:
                        show_split_values_from: pinned_duration
                    visible_if: lib.value('pinned')
                pinned_error_scheduled_task_manager_not_running:
                    grouping: grouping_pinned_right
                    indent: 1
                    snippet:
                        html: |
                            <div class="zenario_fbWarning">Scheduled unpinning is not available. The Scheduled Task Manager is not installed. [[link_start]]Click for more info.[[link_end]]</div>
                    hidden: true
                pinned_error_scheduled_task_master_switch_is_off:
                    grouping: grouping_pinned_right
                    indent: 1
                    snippet:
                        html: |
                            <div class="zenario_fbWarning">Scheduled unpinning is not available. The Scheduled Task Manager is enabled, but the master switch is Off. [[link_start]]Click for more info.[[link_end]]</div>
                    hidden: true
                pinned_error_scheduled_task_master_not_set_up_correctly:
                    grouping: grouping_pinned_right
                    indent: 1
                    snippet:
                        html: |
                            <div class="zenario_fbWarning">Scheduled unpinning is not available. The Scheduled Task Manager is installed and the master switch is On, but the crontab is not set up correctly. [[link_start]]Click for more info.[[link_end]]</div>
