# You must use a tab-size of 4 spaces to edit this file.
---
zenario_admin:
    tabs:
        settings:
            edit_mode:
                priv: _PRIV_EDIT_ADMIN
                enabled: true
            notices:
                is_trashed:
                    show: false
                    type: warning
                    message: This administrator account is trashed and they cannot log in.
            label: Settings
            fields:
                #description:
                #    full_width: true
                #    snippet:
                #        html: >
                #            Use this screen to change how this Admin uses Zenario.
                show_help_tour_next_time:
                    admin_setting:
                        name: show_help_tour_next_time
                    type: checkbox
                    value: 0
                    disabled: true
                    label: Show this administrator the help tour when they next open Organizer
                show_dev_tools:
                    admin_setting:
                        name: show_dev_tools
                    type: checkbox
                    value: ''
                    label: Allow this administrator to view the developer tools
                    redraw_onchange: true
        history:
            visible_if: |
                zenarioAB.tuix.key.id
            ord: 999999
            edit_mode:
                priv: _PRIV_EDIT_ADMIN
                enabled: true
            label: History
            fields:
                datetime_created: 
                    label: "Created:"
                    type: text
                    readonly: true
                    show_as_a_span: true
                last_login: 
                    label: "Last login:"
                    type: text
                    readonly: true
                    show_as_a_span: true
                last_login_browser_and_ip:
                    label: "Last login browser & IP address:"
                    type: text
                    readonly: true
                    show_as_a_span: true