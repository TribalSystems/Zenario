# You must use a tab-size of 4 spaces to edit this file.
---
sections:
    translations:
        custom_template_buttons_current:
           'znz_this':
                label: 'This is the [[english_name]] ([[id]]) translation'
                label_og: 'This is the original (in [[english_name]] ([[id]]))'
                parent: 'current_language_button'
                frontend_link: ''
        
        custom_template_buttons_exists:
           'znz_go':
                label: '[[english_name]] ([[id]])'
                parent: 'existing_translations_dropdown'
                frontend_link: ''
        
        custom_template_buttons_missing:
           'znz_missing':
                label: '[[english_name]] ([[id]])'
                parent: 'existing_translations_dropdown'
                css_class: 'zenario_at_trans_dropdown__missing'
        
        custom_template_buttons_missing_can_create:
            'znz_create':
                #Create a translation in...
                label: '[[english_name]] ([[id]])'
                parent: 'create_translation_in_dropdown'
                admin_box: 
                    path: zenario_content
                    key: 
                        id: 'zlangIdz'
                        translate: 1
            
            'znz_add_existing_translation_to_chain':
                label: '[[english_name]] ([[id]])'
                parent: 'attach_translation_in_dropdown'
                pick_items:
                    path: zenario__content/panels/content/refiners/add_translation_to_chain//zlangIdz//
                    min_path: zenario__content/panels/content
                    max_path: zenario__content/panels/content
                    target_path: zenario__content/panels/content
                    disallow_refiners_looping_on_min_path: true
                    one_to_one_choose_phrase: Add to chain
                    disabled_if_for_all_selected_items: |
                        item.is_collision
                    ajax:
                        confirm:
                            message: |
                                Add this content item to the translation chain?
                            button_message: Add
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            add_existing_translation_to_chain: 1
        
        
        buttons: {}
            current_language_button:
                css_class: current_language_button
                label: 'This is the [[english_name]] translation'
            existing_translations_dropdown:
                css_class: existing_translations_dropdown
                label: "Existing translations"
            create_translation_in_dropdown:
                css_class: create_translation_in_dropdown
                label: "Create translation in..."
            attach_translation_in_dropdown:
                css_class: attach_translation_in_dropdown
                label: "Attach to chain item in..."
