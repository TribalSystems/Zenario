# You must use a tab-size of 4 spaces to edit this file.
---
toolbars:
    create:
        ord: 20
        priv: _PRIV_EDIT_DRAFT
        label: New...
        page_mode: preview
        toolbar_tab_grouping: create
        toolbar_microtemplate: zenario_toolbar_create_tab
    edit_disabled:
        ord: 30
        priv: _PRIV_EDIT_DRAFT
        label_when_grouping_inactive: Tools...
        label: Content item
        tooltip: ''
        page_mode: edit_disabled
        toolbar_tab_grouping: edit
        toolbar_microtemplate: zenario_toolbar_edit_tab
    edit:
        ord: 31
        priv: _PRIV_EDIT_DRAFT
        label_when_grouping_inactive: Tools...
        label: Content item
        tooltip: ''
        page_mode: edit
        toolbar_tab_grouping: edit
        toolbar_microtemplate: zenario_toolbar_edit_tab
    rollback:
        ord: 32
        priv: _PRIV_EDIT_DRAFT
        label_when_grouping_inactive: Tools...
        label: Content item
        tooltip: You are viewing a previous version of this content item
        page_mode: rollback
        toolbar_tab_grouping: edit
        toolbar_microtemplate: zenario_toolbar_edit_tab
    restricted_editing:
        ord: 33
        priv: _PRIV_EDIT_DRAFT
        label: Restricted editing
        tooltip: Editing this content item is restricted
        page_mode: preview
        toolbar_tab_grouping: edit
        toolbar_microtemplate: zenario_toolbar_restricted_editing_tab
        
    menu1:
        ord: 50
        priv: _PRIV_EDIT_MENU_TEXT
        label: Menu
        css_class: zenario_at_menu_tab zenario_at_menu_tab_primary
        page_mode: menu
        toolbar_tab_grouping: edit
        toolbar_microtemplate: zenario_toolbar_menu_tab
        tooltip: ''
        visible_if: zenarioA.toolbar != 'preview' && zenarioA.toolbar != 'create'
    menu_secondary:
        ord: 51
        priv: _PRIV_EDIT_MENU_TEXT
        parent: menu1
        label: 
        css_class: zenario_at_menu_tab zenario_at_menu_tab_secondary
        page_mode: menu
        toolbar_tab_grouping: edit
        toolbar_microtemplate: zenario_toolbar_menu_tab
    layout:
        ord: 60
        priv: _PRIV_MANAGE_TEMPLATE_SLOT
        label: Layout
        page_mode: layout
        toolbar_tab_grouping: edit
        toolbar_microtemplate: zenario_toolbar_layout_tab
        visible_if: zenarioA.toolbar != 'preview' && zenarioA.toolbar != 'create'
    preview:
        ord: 70
        label: Browse
        page_mode: preview
        toolbar_tab_grouping: preview
        css_class: zenario_toolbar_tab_back
        toolbar_microtemplate: zenario_toolbar_preview_tab
sections:
    layout:
        appears_in_toolbars:
            layout: true
        buttons:
            id_and_name:
                hidden: true
                label: 
            usage:
                hidden: true
                label:
            
            edit_css:
                priv: _PRIV_EDIT_CSS
                label: CSS
            edit_skin:
                priv: _PRIV_EDIT_CSS
                label: Edit skin
                parent: edit_css
                #admin_box: 
                #    key:
                #        skinId: 0
                #    path: zenario_skin_editor
                onclick: |
                    zenarioSE.open();
            body_classes:
                appears_in_toolbars:
                    layout: true
                parent: edit_css
                label: CSS classes that appear on the <body> tag
                popout:
                    href: zenario/admin/help/help.php?topic=body_classes
                    #width: 100%
                    #height: 100%
                    #maxWidth: 100%
                    #maxHeight: 100%
                    #initialWidth: 100%
                    #initialHeight: 100%
                    iframe: true
                    fixed: true
                    transition: none
                    css_class: zenario_help_window
            
            edit_grid:
                hide_when_children_are_not_visible: true
                label: Edit with Gridmaker
            edit_body_slots:
                parent: edit_grid
                priv: _PRIV_EDIT_TEMPLATE
                label: Edit layout
                popout:
                    href: zenario/admin/grid_maker/grid_maker.php?loadTemplateFile=1
                    width: 100%
                    height: 100%
                    maxWidth: 100%
                    maxHeight: 100%
                    initialWidth: 100%
                    initialHeight: 100%
                    iframe: true
                    escKey: false
                    fixed: true
                    transition: none
                    css_class: zenario_grid_maker
            edit_head_slots:
                parent: edit_grid
                priv: _PRIV_EDIT_SITEWIDE
                label: Edit site-wide header
                popout:
                    href: zenario/admin/grid_maker/grid_maker.php?edit_head_slots=1
                    width: 100%
                    height: 100%
                    maxWidth: 100%
                    maxHeight: 100%
                    initialWidth: 100%
                    initialHeight: 100%
                    iframe: true
                    escKey: false
                    transition: none
                    css_class: zenario_grid_maker
            edit_foot_slots:
                parent: edit_grid
                priv: _PRIV_EDIT_SITEWIDE
                label: Edit site-wide footer
                popout:
                    href: zenario/admin/grid_maker/grid_maker.php?edit_foot_slots=1
                    width: 100%
                    height: 100%
                    maxWidth: 100%
                    maxHeight: 100%
                    initialWidth: 100%
                    initialHeight: 100%
                    iframe: true
                    escKey: false
                    transition: none
                    css_class: zenario_grid_maker
            settings:
                label: Layout settings
                admin_box:
                    path: zenario_layout

            skq:
                label: Organize layouts
                organizer_quick:
                    path: 
                    target_path: zenario__layouts/panels/layouts
                    min_path: zenario__layouts/panels/layouts
                    max_path: false
                    disallow_refiners_looping_on_min_path: false
                    reload_admin_toolbar: true
    
    slot_controls:
        buttons:
            head_foot_dropdown:
                label: HTML/JS
                hide_when_children_are_not_visible: false
            item_head:
                parent: head_foot_dropdown
                priv: _PRIV_MANAGE_ITEM_SLOT
                visible_if: |
                    zenarioA.checkSpecificPermsOnThisPage()
                appears_in_toolbars:
                    edit: true
                label: HTML/JS in <head>
                admin_box:
                    path: zenario_head_foot_slot
                    key:
                        mode: head
                        level: item
            item_foot:
                parent: head_foot_dropdown
                priv: _PRIV_MANAGE_ITEM_SLOT
                visible_if: |
                    zenarioA.checkSpecificPermsOnThisPage()
                appears_in_toolbars:
                    edit: true
                label: HTML/JS before </body>
                admin_box:
                    path: zenario_head_foot_slot
                    key:
                        mode: foot
                        level: item
            layout_head:
                parent: head_foot_dropdown
                appears_in_toolbars:
                    layout: true
                admin_box:
                    path: zenario_head_foot_slot
                    key:
                        mode: head
                        level: layout
            layout_foot:
                parent: head_foot_dropdown
                appears_in_toolbars:
                    layout: true
                admin_box:
                    path: zenario_head_foot_slot
                    key:
                        mode: foot
                        level: layout
            global:
                parent: head_foot_dropdown
                appears_in_toolbars:
                    layout: true
                label: Site-wide <head> and <body>
                admin_box:
                    path: site_settings
                    key:
                        id: head_and_foot
    

meta_info:
    title: ''
    version: ''
