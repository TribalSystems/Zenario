# You must use a tab-size of 4 spaces to edit this file.
---
sections:
    icons:
        buttons:
            tag_id:
                ord: 1
                css_class: zenario_at_icon_tag_id
                label: ""
                appears_in_toolbars:
                    preview: true
                    edit: true
            version_1:
                ord: 2
                hidden: true
                css_class: zenario_at_icon_version
                label: ""
                appears_in_toolbars:
                    preview: true
                    edit: true
            version_2:
                ord: 3
                hidden: true
                css_class: zenario_at_icon_version
                label: ""
                appears_in_toolbars:
                    preview: true
                    edit: true
            version_3:
                ord: 4
                hidden: true
                css_class: zenario_at_icon_version
                label: ""
                appears_in_toolbars:
                    preview: true
                    edit: true
            staging_mode:
                ord: 5
                css_class: zenario_at_icon_staging_mode
                admin_box:
                    path: zenario_content_staging_mode
                appears_in_toolbars:
                    preview: true
                    edit: true
            layout_id:
                ord: 6
                css_class: zenario_at_icon_layout
                admin_box:
                    path: zenario_content_layout
                    key:
                        fromAdminToolbar: true
                appears_in_toolbars:
                    preview: true
                    edit: true
            
            #If the Users module is running, it will insert the permissions icon with ord 7.
            
            language_id:
                ord: 8
                css_class: zenario_at_icon_language
                label: ""
                appears_in_toolbars:
                    preview: true
                    edit: true
                    translations: true
            alias_dropdown:
                ord: 9
                css_class: zenario_at_icon_alias
                appears_in_toolbars:
                    preview: true
                    edit: true
                    translations: true
            alias:
                ord: 10
                visible_if: |
                    zenarioA.checkSpecificPermsOnThisPage()
                parent: alias_dropdown
                label: Edit alias
                admin_box:
                    priv: _PRIV_EDIT_DRAFT
                    path: zenario_alias
                appears_in_toolbars:
                    preview: true
                    edit: true
                    translations: true
            copy_url:
                ord: 11
                visible_if: zenario.canCopy()
                parent: alias_dropdown
                label: Copy URL/alias to clipboard
                appears_in_toolbars:
                    preview: true
                    edit: true
                    translations: true
            go_to_alias:
                ord: 12
                parent: alias_dropdown
                label: Go to content item via its alias
                appears_in_toolbars:
                    preview: true
                    edit: true
                    translations: true
            
            item_categories_some:
                ord: 13
                css_class: zenario_at_icon_categories_some
                tooltip: Content Item Categories|
                admin_box:
                    priv: _PRIV_EDIT_DRAFT
                    path: zenario_content_categories
                appears_in_toolbars:
                    preview: true
                    edit: true
            item_categories_none:
                ord: 14
                css_class: zenario_at_icon_categories_none
                tooltip: Content Item Categories|None
                admin_box:
                    priv: _PRIV_EDIT_DRAFT
                    path: zenario_content_categories
                appears_in_toolbars:
                    preview: true
                    edit: true
            pinned:
                ord: 15
                css_class: pinned
                tooltip: "This content item is pinned"
                admin_box:
                    path: zenario_content
                appears_in_toolbars:
                    preview: true
                    edit: true
            not_pinned:
                ord: 16
                css_class: not_pinned
                tooltip: "This content item is not pinned"
                admin_box:
                    path: zenario_content
                appears_in_toolbars:
                    preview: true
                    edit: true
