---
sections:
    slot_wand:
        buttons:
            show_empty_slots_off:
                css_class: zenario_toolbar_toggle zenario_toolbar_toggle_off
                tooltip: Show mobile & empty slots
                visible_if: '!zenarioA.showEmptySlotsOn'
                onclick: |
                    zenarioA.toggleShowEmptySlots(true);
                    zenarioT.notification(zenarioA.phrase.showingEmptySlots);
            show_empty_slots_on:
                css_class: zenario_toolbar_toggle zenario_toolbar_toggle_on
                tooltip: Hide mobile & empty slots
                visible_if: zenarioA.showEmptySlotsOn
                onclick: |
                    zenarioA.toggleShowEmptySlots(false);
            show_grid_off:
                css_class: zenario_toolbar_toggle zenario_toolbar_toggle_off
                tooltip: Show gridlines
                visible_if: '!zenarioA.showGridOn'
                onclick: |
                    zenarioA.toggleShowGrid();
                    zenarioT.notification(zenarioA.phrase.showingGridlines);
            show_grid_on:
                css_class: zenario_toolbar_toggle zenario_toolbar_toggle_on
                tooltip: Hide gridlines
                visible_if: zenarioA.showGridOn
                onclick: |
                    zenarioA.toggleShowGrid();
