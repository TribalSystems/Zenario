# You must use a tab-size of 4 spaces to edit this file.
---
zenario__content:
    panels:
        slots:
            priv: _PRIV_VIEW_SLOT
            key:
                cID: false
                cType: false
                cVersion: false
                layoutId: false
            refiners:
                content_item:
                    exists: true
                content_item_from_menu_node:
                    exists: true
                layout:
                    exists: true
            refiner_required: true
            
            panel_type: slot_reload_on_change
            
            columns:
                ord:
                    hidden: true
                slot_name:
                    title: Slot name
                    searchable: true
                    disallow_sorting: true
                    always_show: true
                sitewide:
                    title: Slot contents (site-wide)
                    searchable: true
                    always_show: true
                    disallow_sorting: true
                    width: large
                    html: true
                layout:
                    title: Slot contents (layout)
                    searchable: true
                    always_show: true
                    disallow_sorting: true
                    width: large
                    html: true
                content_item:
                    title: Slot contents (content item)
                    searchable: true
                    always_show: true
                    disallow_sorting: true
                    width: large
                    html: true
                visitor_sees:
                    title: Visitor sees
                    searchable: true
                    always_show: true
                    disallow_sorting: true
                    width: xlarge
                    html: true
                module_id:
                    exists: true
                instance_id:
                    exists: true
            default_sort_column: ord
            item:
                name: Slot
                css_class: slot
            
            custom_template_buttons:
                insert_version_controlled_plugin:
                    parent: insert_dropdown
                    ord: ''
                    label: ''
                    ajax:
                        confirm:
                            html: true
                            button_message: ''
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            addPlugin: ''
                    with_columns_set:
                        empty: true
                    without_columns_set:
                        is_sitewide: true
                    visible_if: >
                        zenarioO.refiner && zenarioO.refiner.name == 'layout'
            
            item_buttons:
                insert_dropdown:
                    label: Insert into slot...
                    hide_when_children_are_not_visible: true
                
                insert_reusable_on_item_layer:
                    parent: insert_dropdown
                    label: Insert plugin...
                    combine_items:
                        path: zenario__modules/panels/modules/refiners/slotable_only////
                        target_path: zenario__modules/panels/plugins
                        min_path: zenario__modules/panels/modules
                        max_path: zenario__modules/panels/plugins
                        one_to_one_choose_phrase: Insert plugin
                        request:
                            level: 1
                            addPluginInstance: 1
                    with_columns_set:
                        empty: true
                    without_columns_set:
                        is_sitewide: true
                    visible_if: >
                        zenarioO.refiner && (zenarioO.refiner.name == 'content_item' || zenarioO.refiner.name == 'content_item_from_menu_node')
                
                insert_nest_on_item_layer:
                    hidden: true    # N.b. this will be unhidden if a nest module is running
                    parent: insert_dropdown
                    label: Insert nest...
                    combine_items:
                        class_name: zenario_common_features
                        path: zenario__modules/panels/plugins/refiners/nests////
                        target_path: zenario__modules/panels/plugins
                        min_path: zenario__modules/panels/plugins
                        max_path: zenario__modules/panels/plugins
                        one_to_one_choose_phrase: Insert nest
                        request:
                            level: 1
                            addPluginInstance: 1
                    with_columns_set:
                        empty: true
                    without_columns_set:
                        is_sitewide: true
                    visible_if: >
                        zenarioO.refiner && (zenarioO.refiner.name == 'content_item' || zenarioO.refiner.name == 'content_item_from_menu_node')
                
                insert_slideshow_on_item_layer:
                    hidden: true    # N.b. this will be unhidden if a slideshow module is running
                    parent: insert_dropdown
                    label: Insert slideshow...
                    combine_items:
                        class_name: zenario_common_features
                        path: zenario__modules/panels/plugins/refiners/slideshows////
                        target_path: zenario__modules/panels/plugins
                        min_path: zenario__modules/panels/plugins
                        max_path: zenario__modules/panels/plugins
                        one_to_one_choose_phrase: Insert slideshow
                        request:
                            level: 1
                            addPluginInstance: 1
                    with_columns_set:
                        empty: true
                    without_columns_set:
                        is_sitewide: true
                    visible_if: >
                        zenarioO.refiner && (zenarioO.refiner.name == 'content_item' || zenarioO.refiner.name == 'content_item_from_menu_node')
                
                
                insert_reusable_on_layout_layer:
                    parent: insert_dropdown
                    priv: _PRIV_MANAGE_TEMPLATE_SLOT
                    label: Insert plugin...
                    combine_items:
                        path: zenario__modules/panels/modules/refiners/slotable_only////
                        target_path: zenario__modules/panels/plugins
                        min_path: zenario__modules/panels/modules
                        max_path: zenario__modules/panels/plugins
                        one_to_one_choose_phrase: Insert plugin
                        request:
                            level: 2
                            addPluginInstance: 1
                    with_columns_set:
                        empty: true
                    without_columns_set:
                        is_sitewide: true
                    visible_if: >
                        zenarioO.refiner && zenarioO.refiner.name == 'layout'
                
                insert_nest_on_layout_layer:
                    hidden: true    # N.b. this will be unhidden if a nest module is running
                    parent: insert_dropdown
                    priv: _PRIV_MANAGE_TEMPLATE_SLOT
                    label: Insert nest...
                    combine_items:
                        class_name: zenario_common_features
                        path: zenario__modules/panels/plugins/refiners/nests////
                        target_path: zenario__modules/panels/plugins
                        min_path: zenario__modules/panels/plugins
                        max_path: zenario__modules/panels/plugins
                        one_to_one_choose_phrase: Insert nest
                        request:
                            level: 2
                            addPluginInstance: 1
                    with_columns_set:
                        empty: true
                    without_columns_set:
                        is_sitewide: true
                    visible_if: >
                        zenarioO.refiner && zenarioO.refiner.name == 'layout'
                
                insert_slideshow_on_layout_layer:
                    hidden: true    # N.b. this will be unhidden if a slideshow module is running
                    parent: insert_dropdown
                    priv: _PRIV_MANAGE_TEMPLATE_SLOT
                    label: Insert slideshow...
                    combine_items:
                        class_name: zenario_common_features
                        path: zenario__modules/panels/plugins/refiners/slideshows////
                        target_path: zenario__modules/panels/plugins
                        min_path: zenario__modules/panels/plugins
                        max_path: zenario__modules/panels/plugins
                        one_to_one_choose_phrase: Insert slideshow
                        request:
                            level: 2
                            addPluginInstance: 1
                    with_columns_set:
                        empty: true
                    without_columns_set:
                        is_sitewide: true
                    visible_if: >
                        zenarioO.refiner && zenarioO.refiner.name == 'layout'
                        
                
                remove_from_layout_layer: &remove_from_layout_layer
                    priv: _PRIV_MANAGE_TEMPLATE_SLOT
                    label: Remove plugin from slot
                    ajax:
                        confirm:
                            html: true
                            button_message: Remove
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            level: 2
                            removePlugin: 1
                    with_columns_set:
                        full: true
                        layout_filled: true
                        is_plugin: true
                    visible_if: >
                        zenarioO.refiner && zenarioO.refiner.name == 'layout'
                
                remove_from_item_layer: &remove_from_item_layer
                    label: Remove plugin from slot
                    ajax:
                        confirm:
                            message: 'Are you sure you wish to remove [[content_item_plain_text]] from the slot on this content item?'
                            button_message: Remove
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            level: 1
                            removePlugin: 1
                    with_columns_set:
                        full: true
                        content_item_filled: true
                        is_plugin: true
                    visible_if: >
                        zenarioO.refiner && (zenarioO.refiner.name == 'content_item' || zenarioO.refiner.name == 'content_item_from_menu_node')
                
                #Some alternate versions of the buttons above, just with different labels for different situations
                remove_nest_from_layout_layer: *remove_from_layout_layer
                    label: Remove nest from slot
                    with_columns_set:
                        full: true
                        layout_filled: true
                        is_nest: true
                remove_nest_from_item_layer: *remove_from_item_layer
                    label: Remove nest from slot
                    with_columns_set:
                        full: true
                        content_item_filled: true
                        is_nest: true
                remove_slideshow_from_layout_layer: *remove_from_layout_layer
                    label: Remove slideshow from slot
                    with_columns_set:
                        full: true
                        layout_filled: true
                        is_slideshow: true
                remove_slideshow_from_item_layer: *remove_from_item_layer
                    label: Remove slideshow from slot
                    with_columns_set:
                        full: true
                        content_item_filled: true
                        is_slideshow: true
                
                hide_plugin:
                    label: Show nothing on this content item
                    ajax:
                        confirm:
                            message: 'Are you sure you wish to show nothing in this slot on this content item?'
                            button_message: Hide
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            level: 1
                            hidePlugin: 1
                    with_columns_set:
                        full: true
                        layout_or_sitewide_filled: true
                    visible_if: >
                        zenarioO.refiner && (zenarioO.refiner.name == 'content_item' || zenarioO.refiner.name == 'content_item_from_menu_node')
                
                show_plugin:
                    label: Show
                    label: Stop hiding on this content item
                    ajax:
                        confirm:
                            message: 'Are you sure you wish to stop hiding [[layout_plain_text]] on this content item?'
                            button_message: Show
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            level: 1
                            showPlugin: 1
                    with_columns_set:
                        opaque: true
                        layout_or_sitewide_filled: true
                    visible_if: >
                        zenarioO.refiner && (zenarioO.refiner.name == 'content_item' || zenarioO.refiner.name == 'content_item_from_menu_node')
