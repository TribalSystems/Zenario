# You must use a tab-size of 4 spaces to edit this file.
---
zenario__menu:
    panels:
        sections:
            title: Menu Sections
            #default_sort_column: name
            #default_sort_desc: Yes
            notice: 
                type: warning
                show: true
                message: This is an advanced feature, as changing menu sections affects whole site navigation. If you're not sure about this, you should probably go to "Main" and edit menu nodes there.
            db_items:
                table: '[[DB_PREFIX]]menu_sections AS ms'
                id_column: ms.id
                client_side: Yes
            columns:
                name:
                    title: Section name
                    searchable: Yes
                    db_column: ms.section_name
                    show_by_default: Yes
            item:
                name: Section
                names: Sections
                css_class: menu_section
                tooltip_when_link_is_active: 'View menu nodes in the section &quot;[[name]]&quot;.'
                link:
                    path: zenario__menu/panels/menu_nodes
                    branch: Yes
                    refiner: section
            collection_buttons:
                advanced_dropdown:
                    label: Advanced
                    ord: 20
                    hide_when_children_are_not_visible: Yes
                help:
                    label: Help
                    ord: 30
                    hide_in_select_mode: true
                    help:
                        message: |
                            Menu sections are the way in which Zenario organises broad parts of the menu navigation.
                            
                            On most sites they represent visible parts of the menu, such as the main menu navigation near the top of every page, and a footer menu near the bottom.
                            
                            On large sites that are arranged into separate areas, such as sub-sites, or private areas of a larger site, additional menu sections are created to contain the navigation for those parts of the site.
                            
                            There is always a menu section called "Main", although administrators may create additional menu sections.
            item_buttons:
                view_dropdown:
                    label: View
                    ord: 10
                    multiple_select: Yes
                    hide_when_children_are_not_visible: Yes
                advanced_dropdown:
                    label: Advanced
                    ord: 20
                    multiple_select: Yes
                    hide_when_children_are_not_visible: Yes
