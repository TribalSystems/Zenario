# You must use a tab-size of 4 spaces to edit this file.
---
zenario__content:
    panels:
        background_images:
            view_ mode: grid
            key:
                usage: background_image
            title: Background images
            no_items_message: There are no existing background images.
            grid_view_microtemplate: zenario_grid_view_image
            slidedown_view_microtemplate: zenario_slidedown_view_image
            db_items:
                table: '[[DB_PREFIX]]files AS f'
                where_statement: |
                    WHERE f.`usage` = 'background_image'
                      AND f.mime_type IN ('image/gif', 'image/png', 'image/jpeg', 'image/webp', 'image/svg+xml')
                id_column: f.id
            columns:
                id:
                    db_column: f.id
                filename:
                    title: Filename
                    searchable: true
                    db_column: f.filename
                    show_by_default: true
                checksum:
                    db_column: f.checksum
                mime_type:
                    server_side_only: true
                    db_column: f.mime_type
                size:
                    title: Size
                    format: filesize
                    db_column: f.size
                    show_by_default: true
                    align_right: true
                    width: xsmall
                width:
                    title: Width
                    searchable: true
                    db_column: f.width
                    show_by_default: true
                    align_right: true
                    width: xsmall
                height:
                    title: Height
                    searchable: true
                    db_column: f.height
                    show_by_default: true
                    align_right: true
                    width: xsmall
            default_sort_column: filename
            label_format_for_popouts: |
                [[filename]]
                [[[width]] × [[height]]]
            label_format_for_picked_items: |
                [[filename]]
                [[[width]] × [[height]]]
            item:
                css_class: media_image
            inline_buttons:
                view:
                    css_class: inspect
                    tooltip: View image
                    popout:
                        href: zenario/file.php?popout=1