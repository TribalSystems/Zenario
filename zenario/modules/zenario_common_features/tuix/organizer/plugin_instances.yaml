# You must use a tab-size of 4 spaces to edit this file.
---
zenario__library:
    panels:
        plugins:
            key:
                skinId: ''
                moduleId: ''
                moduleIds: ''
            title: Plugin library
            select_mode_title: Select a plugin
            
            panel_type: multi_line_list_or_grid
            css_class: three_line_list_panels
            use_tall_rows: true
            
            notice:
                #This notice will be shown if there are any instances of that module
                #which are in a nest and/or slideshow.
                message: ''
                type: warning
                show: false
                html: true

            db_items:
                #If displaying nests/slideshows which contain plugins of a specific module,
                #there will be a table join and extra WHERE statement added in the PHP class.
                table: |
                    [[DB_PREFIX]]plugin_instances AS pi
                    INNER JOIN [[DB_PREFIX]]modules AS m
                       ON m.id = pi.module_id
                id_column: pi.id
                where_statement: |
                    WHERE pi.content_id = 0
                custom__exclude_nests_and_slideshows: |
                    AND pi.module_id NOT IN (
                        SELECT id
                        FROM [[DB_PREFIX]]modules
                        WHERE class_name IN ('zenario_nest', 'zenario_ajax_nest', 'zenario_slideshow')
                    )
            refiners:
                plugin:
                    sql: 'pi.module_id = [[REFINER_ID]]'
                nests:
                    title: Nest library
                    select_mode_title: Select a nest
                    sql: |
                        pi.module_id IN (SELECT id FROM [[DB_PREFIX]]modules WHERE class_name IN ('zenario_nest', 'zenario_ajax_nest'))
                slideshows:
                    title: Slideshow library
                    select_mode_title: Select a slideshow
                    sql: |
                        pi.module_id = (SELECT id FROM [[DB_PREFIX]]modules WHERE class_name = 'zenario_slideshow')
                view_nests_containing: {}
                    #The necessary table join and WHERE statement is added in the PHP class.
                
                plugins_using_form:
                    sql: |
                        pi.id IN (
                            SELECT instance_id
                            FROM [[DB_PREFIX]]plugin_settings
                            WHERE foreign_key_to = 'user_form'
                              AND foreign_key_id = [[REFINER_ID]]
                              AND egg_id = 0
                        )
                nests_using_form:
                    sql: |
                        pi.module_id IN (SELECT id FROM [[DB_PREFIX]]modules WHERE class_name IN ('zenario_nest', 'zenario_ajax_nest'))
                        AND pi.id IN (
                            SELECT instance_id
                            FROM [[DB_PREFIX]]plugin_settings
                            WHERE foreign_key_to = 'user_form'
                              AND foreign_key_id = [[REFINER_ID]]
                              AND egg_id != 0
                        )
                
                plugins_using_image:
                    sql: |
                        pi.id IN (
                            SELECT foreign_key_id
                            FROM [[DB_PREFIX]]inline_images AS iiu
                            WHERE foreign_key_to = 'library_plugin'
                              AND image_id = [[REFINER_ID]]
                        )
                nests_using_image:
                    sql: |
                        pi.module_id IN (SELECT id FROM [[DB_PREFIX]]modules WHERE class_name IN ('zenario_nest', 'zenario_ajax_nest'))
                        AND pi.id IN (
                            SELECT foreign_key_id
                            FROM [[DB_PREFIX]]inline_images AS iiu
                            WHERE foreign_key_to = 'library_plugin'
                              AND image_id = [[REFINER_ID]]
                        )
                slideshows_using_image:
                    sql: |
                        pi.module_id = (SELECT id FROM [[DB_PREFIX]]modules WHERE class_name = 'zenario_slideshow')
                        AND pi.id IN (
                            SELECT foreign_key_id
                            FROM [[DB_PREFIX]]inline_images AS iiu
                            WHERE foreign_key_to = 'library_plugin'
                              AND image_id = [[REFINER_ID]]
                        )
                email_address_setting:
                    table_join: |
                        [[DB_PREFIX]]plugin_settings ps
                        ON pi.id = ps.instance_id
                    sql: |
                        (
                            ps.is_email_address = 1 
                            OR 
                            (
                                (ps.is_email_address IS NULL) AND (ps.name LIKE '%email%')
                            )
                        )
                        AND 
                            ps.value != ''
                        AND 
                            ps.is_content = 'synchronized_setting'
                        AND
                            ps.value REGEXP '[^@ ]+@[^. ]+(\\.[^.]+)+'
                    
            #quick_filter_buttons:
            #    module:
            #        label: 'All modules'
            #    all_modules:
            #        parent: module
            #        label: 'All modules'
            #        column: module_id
            #        value: ''
            #        remove_filter: true

            #quick_filter_buttons: 
            #    test: 
            #        label: Show most recent
            #        column: id
            #        value: 37
            
            columns:
                id:
                    format: id
                    db_column: pi.id
                    searchable: true
                    #Please note: the chop_prefix_from_search property will change
                    #to "N" when viewing nests, or to "S" when viewing slideshows.
                    chop_prefix_from_search: P
                code:
                    title: ID
                    format: id
                    always_show: true
                    db_column: pi.id
                    sort_column: pi.id
                    searchable: true
                    width: xxsmall
                name:
                    title: Plugin name
                    db_column: pi.name
                    searchable: true
                    always_show: true
                    width: xxlarge
                module_id:
                    title: Module ID
                    hidden: true
                    db_column: pi.module_id
                    format: enum
                    values: {}
                module_name:
                    parent: name
                    title: Module
                    always_show: true
                    visible_if: |
                        !tuix.key.moduleId
                    db_column: m.display_name
                    searchable: true
                    disallow_filtering: true
                module_class_name:
                    db_column: m.class_name
                # To do: rework the "Copy plugin" button for the 10.4 database changes
                #nestable:
                #    db_column: m.nestable
                where_used:
                    parent: name
                    title: Usage
                    show_by_default: true
                    width: xlarge
                    html: true
                    css_class: 'organizer_cell_line otherline no_italics'
                plugin_email_address:
                    title: Email
                    db_column: |
                        (
                           SELECT GROUP_CONCAT(DISTINCT ps1.value SEPARATOR ', ')
                           FROM [[DB_PREFIX]]plugin_settings ps1
                           WHERE ps1.instance_id = pi.id
                           AND
                           (
                                ps1.is_email_address = 1 
                                OR 
                                (
                                    (ps1.is_email_address IS NULL) AND (ps1.name LIKE '%email%')
                                )
                            )
                            AND 
                                ps1.value != ''
                            AND 
                                ps1.is_content = 'synchronized_setting'
                            AND
                                ps1.value REGEXP '[^@ ]+@[^. ]+(\\.[^.]+)+'
                            
                        )
                    width: xxlarge
                    ord: 100
                    show_by_default: true
                framework:
                    title: Framework
                    db_column: pi.framework
            item:
                css_class: plugin_album_instance
                link:
                    path: zenario__library/panels/nested_plugins
                    refiner: nest
            collection_buttons:
                create:
                    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
                    visible_if: |
                        tuix.key.moduleId
                    css_class: zenario_create_a_new
                    label: Create a ~plugin~
                    admin_box:
                        path: plugin_settings
                        create_another: false
                view_nests_containing:
                    label: View nests/slideshows containing plugins of this module
                    hidden: true
                    hide_on_refiner: view_nests_containing
                    link:
                        path: zenario__library/panels/plugins
                        refiner: view_nests_containing
                create_dropdown:
                    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
                    visible_if: |
                        !tuix.key.moduleId
                    css_class: zenario_create_a_new
                    hide_when_children_are_not_visible: true
                    hide_on_refiner: email_address_setting
                    label: Create a ~plugin~
                import:
                    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
                    label: Import ~plugin~ specification
                    upload:
                        accept: application/x-gzip
                        extensions:
                            - .yaml.gz
                        multi: false
                        drag_and_drop: false
                        request:
                            import: 1
                help:
                    label: Help
                    hide_in_select_mode: true
                    help:
                        message: |
                            A plugins is an instance of one of Zenario's modules. A plugin can be used in one or multiple places on a Zenario site, and must be placed in a slot in order to appear to visitors.
                            
                            To put a plugin on a content item via the front end, use the Tools menu, and then the Content item view (to add a plugin to a content item), or the Layout view (to add a plugin to the Layout, thereby affecting all content items that use that Layout). You may need to click "Show mobile & empty slots" to reveal slots that don't already have anything in them. Then click the Slot Inspector, click "Insert...", then select a plugin. (You may need to create a new plugin, depending on what you need.)
                            
                            A plugin has settings that determine how it should work or appear. Once a plugin is in a slot, use the Tools menu to get to the Content item view or Layout view, click the Slot Inspector, and then "Edit plugin settings".
                            
                            When editing plugin settings, changes go live immediately and cannot be undone. Also note that a plugin may be used in slots on several content items or layouts.
                            
                            Some kinds of plugin work in Nests, and/or in Slideshows. For these, you will need to first add a Nest (or Slideshow) to a content item, then add at least one slide, and then add a plugin on that slide.
            item_buttons:
                edit:
                    priv: _PRIV_VIEW_REUSABLE_PLUGIN
                    label: Edit ~plugin~ settings
                    admin_box:
                        path: plugin_settings
                # The old "CSS & framework" button, commented out now as it has been merged back into the plugin settings
                #framework_and_css:
                #    priv: _PRIV_VIEW_REUSABLE_PLUGIN
                #    label: 'CSS & framework'
                #    admin_box:
                #        path: plugin_css_and_framework
                view_dropdown:
                    label: View
                    multiple_select: true
                    hide_when_children_are_not_visible: true
                view_nest_contents:
                    parent: view_dropdown
                    label: Nest contents
                    link:
                        path: zenario__library/panels/nested_plugins
                        refiner: nest
                    visible_if: |
                        (item.module_class_name == 'zenario_nest' || item.module_class_name == 'zenario_ajax_nest')
                view_slideshow_contents:
                    parent: view_dropdown
                    label: Slideshow contents
                    link:
                        path: zenario__library/panels/images_in_slideshow
                        refiner: nest
                    visible_if: |
                        (item.module_class_name == 'zenario_slideshow')
                view:
                    parent: view_dropdown
                    label: Plugin's image
                    popout:
                        href: zenario/file.php?popout=1
                    with_columns_set:
                        has_image: true
                    visible_if: |
                        item.module_class_name != 'zenario_nest' &&
                        item.module_class_name != 'zenario_ajax_nest' &&
                        item.module_class_name != 'zenario_slideshow'
                usage_layouts:
                    parent: view_dropdown
                    label: "Layouts using this ~plugin~"
                    visible_if_for_all_selected_items: item.usage_layouts > 0
                    hide_in_select_mode: true
                    link:
                        path: zenario__layouts/panels/layouts
                        refiner: plugin_instance_usage
                usage_item:
                    parent: view_dropdown
                    label: "Items using this ~plugin~"
                    visible_if_for_all_selected_items: item.usage_item > 0
                    hide_in_select_mode: true
                    link:
                        path: zenario__content/panels/content
                        refiner: plugin_instance_usage
                view_content_items:
                    parent: view_dropdown
                    label: Effective usage
                    visible_if_for_all_selected_items: item.usage_item > 0 || item.usage_layouts > 0
                    hide_in_select_mode: true
                    link:
                        path: zenario__content/panels/content
                        refiner: plugin_instance_effective_usage
                action_dropdown:
                    label: Actions
                    multiple_select: true
                    hide_when_children_are_not_visible: true
                duplicate:
                    parent: action_dropdown
                    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
                    label: Duplicate
                    admin_box:
                        path: zenario_duplicate_plugin
                export:
                    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
                    parent: action_dropdown
                    label: Export ~plugin~ specification
                    ajax:
                        confirm:
                            message: >
                                Use this to create and download an export containing all of the settings in this ~plugin~.
                                
                                
                                This export contains plugin settings only.
                                Images and uploaded files are not included.
                                
                                
                                Links to users, groups, and content items will not be preserved when importing to another
                                site and will need to be reconfigured manually.
                            button_message: Download
                            cancel_button_message: Cancel
                            message_type: info
                            download: true
                        request:
                            export: 1
                import_overwrite:
                    parent: action_dropdown
                    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
                    label: Import and override ~plugin~ specification
                    upload:
                        accept: application/x-gzip
                        extensions:
                            - .yaml.gz
                        multi: false
                        drag_and_drop: false
                        request:
                            import_overwrite: 1
                delete:
                    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
                    ord: 99
                    label: Delete
                    multiple_select: true
                    hide_in_select_mode: false
                    visible_if_for_all_selected_items: item.usage_item == 0 && item.usage_layouts == 0
                    ajax:
                        confirm:
                            message: |
                                Are you sure you wish to delete the ~plugin~ "[[code]] [[name]]"?
                                
                                Its settings will be deleted but any attached images will be left in the image library.
                            multiple_select_message: Are you sure you wish to delete these plugins?
                            button_message: Delete
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            delete: "1"
                delete_used:
                    priv: _PRIV_MANAGE_REUSABLE_PLUGIN
                    ord: 99
                    label: Delete
                    hide_in_select_mode: true
                    visible_if_for_all_selected_items: item.usage_item > 0 || item.usage_layouts > 0
                    ajax:
                        confirm:
                            message: |
                                This ~plugin~ is currently used on [[usage_item]] content item(s) and [[usage_layouts]] layout(s).
                                
                                Deleting it will remove it from these content items and layouts, and this may have an immediate effect on published pages.
                                
                                Any attached images will be left in image library.
                                
                                Are you still sure you wish to delete the ~plugin~ "[[code]] [[name]]"?
                            multiple_select_message: Are you sure you wish to delete these plugins?
                            button_message: Delete
                            cancel_button_message: Cancel
                            message_type: warning
                        request:
                            delete: "1"